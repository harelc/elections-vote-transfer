name: Refresh K26 count

# Two entry points:
#  * schedule (every 5 min) — fully unattended: downloads the CEC file
#    itself (Chrome fallback for the gov.il bot challenge, see
#    download_expb.js), rebuilds only when the snapshot actually moved.
#  * workflow_dispatch — the Netlify poller still dispatches with the
#    sha it accepted; if the file moved since, the inspect step skips
#    and the next tick/schedule run picks the new one up.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      sha256:
        description: sha256 of the results file the poller accepted
        required: false
        type: string
        default: ""
      ballot_count:
        description: ballot rows in that file
        required: false
        type: string
        default: ""
      as_of:
        description: source timestamp
        required: false
        type: string
        default: ""
      final:
        description: mark the count official even below the roster
        required: false
        type: string
        default: "false"
      force:
        description: rebuild even though k26_control.json auto is false
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: k26-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the chicken bit
        id: gate
        run: |
          python - <<'PY'
          import json, os
          forced = os.environ["K26_FORCE"] == "true"
          auto = json.load(open("k26_control.json", encoding="utf-8")).get("auto") is True
          proceed = forced or auto
          if not proceed:
              print("k26_control.json auto is false; leaving the site as it is")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("proceed=" + ("true" if proceed else "false") + "\n")
          PY
        env:
          K26_FORCE: ${{ inputs.force }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.proceed == 'true'

      - name: Download the results file (curl)
        id: curl_dl
        if: steps.gate.outputs.proceed == 'true'
        env:
          K26_RESULTS_URL: ${{ secrets.K26_RESULTS_URL }}
        run: |
          # Public per the CEC K26 guide; the secret only overrides it.
          URL="${K26_RESULTS_URL:-https://media26.bechirot.gov.il/files/expb.csv}"
          mkdir -p data/k26_inbox
          ok=""
          if curl -fsSL "$URL" -o data/k26_inbox/snapshot.bin; then
            # media26 sits behind a gov.il bot challenge: a 404
            # maintenance page or an empty 202 can come back with a
            # success-ish status — only a real CSV header counts.
            if python3 - <<'PY'
          raw = open("data/k26_inbox/snapshot.bin", "rb").read()
          try:
              text = raw.decode("utf-8-sig")
          except UnicodeDecodeError:
              text = raw.decode("cp1255")
          head = text.lstrip()[:2000]
          assert "קלפי" in head and "," in head, "not a ballot CSV"
          print("curl download looks like the ballot CSV")
          PY
            then ok=1; fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.proceed == 'true' && steps.curl_dl.outputs.ok != '1'
        with:
          node-version: "22"

      - name: Download the results file (Chrome fallback)
        # The download script self-limits to ~7 min; cap the step (incl.
        # the Chrome install) so a hung browser can't squat the
        # concurrency group until the 30-min job timeout (seen 28 Oct:
        # 11+ min stuck here, queue frozen behind it).
        timeout-minutes: 12
        if: steps.gate.outputs.proceed == 'true' && steps.curl_dl.outputs.ok != '1'
        env:
          K26_RESULTS_URL: ${{ secrets.K26_RESULTS_URL }}
        run: |
          # The bot challenge needs a real browser: install puppeteer
          # (pulls Chrome) outside the repo and let download_expb.js
          # drive it. NODE_PATH lets the repo script resolve the module.
          npm install --prefix /tmp/expb-dl puppeteer@25 --no-audit --no-fund --fetch-timeout=90000 --fetch-retries=2
          /tmp/expb-dl/node_modules/.bin/puppeteer browsers install chrome
          # Run a copy from /tmp: from the repo root, require('puppeteer')
          # would resolve the repo's older puppeteer (pinned to a
          # different Chrome build) instead of the fresh pair above.
          cp download_expb.js /tmp/expb-dl/
          node /tmp/expb-dl/download_expb.js data/k26_inbox/snapshot.bin

      - name: Inspect the snapshot
        id: inspect
        if: steps.gate.outputs.proceed == 'true'
        env:
          DISPATCH_SHA: ${{ inputs.sha256 }}
          IS_FINAL: ${{ inputs.final }}
          IS_FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, os
          from datetime import datetime, timezone
          raw = open("data/k26_inbox/snapshot.bin", "rb").read()
          try:
              text = raw.decode("utf-8-sig")
          except UnicodeDecodeError:
              text = raw.decode("cp1255")
          rows = list(csv.DictReader(io.StringIO(text)))
          def num(r, k):
              try: return float(r.get(k) or 0)
              except (TypeError, ValueError): return 0.0
          counted = sum(1 for r in rows if num(r, "מצביעים") > 0 or num(r, "כשרים") > 0)
          sha = hashlib.sha256(raw).hexdigest()
          try:
              status = json.load(open("site/data/k26_status.json", encoding="utf-8"))
          except Exception:
              status = {}
          prev_sha = status.get("sha256")
          prev_ballots = status.get("ballots") or 0
          dispatch_sha = os.environ.get("DISPATCH_SHA") or ""
          proceed, reason = True, "new snapshot"
          if counted == 0:
              proceed, reason = False, "no counted ballots yet"
          elif dispatch_sha and dispatch_sha != sha:
              proceed, reason = False, "file moved since the poller accepted it; next run takes the new one"
          elif sha == prev_sha and os.environ.get("IS_FORCE") != "true":
              proceed, reason = False, "snapshot unchanged"
          elif counted < prev_ballots and os.environ.get("IS_FINAL") != "true" and os.environ.get("IS_FORCE") != "true":
              proceed, reason = False, f"ballot count shrank ({prev_ballots} -> {counted}); refusing"
          print(f"counted={counted} sha={sha[:12]} prev_ballots={prev_ballots} proceed={proceed} ({reason})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"proceed={'true' if proceed else 'false'}\n")
              handle.write(f"sha={sha}\n")
              handle.write(f"ballots={counted}\n")
              handle.write("as_of=" + datetime.now(timezone.utc).isoformat() + "\n")
          PY

      - name: Rebuild K26
        if: steps.gate.outputs.proceed == 'true' && steps.inspect.outputs.proceed == 'true'
        run: |
          python refresh_k26.py \
            --csv data/k26_inbox/snapshot.bin \
            --sha256 "${{ steps.inspect.outputs.sha }}" \
            --ballots "${{ steps.inspect.outputs.ballots }}" \
            --as-of "${{ inputs.as_of || steps.inspect.outputs.as_of }}" \
            ${{ inputs.final == 'true' && '--final' || '' }} \
            ${{ inputs.force == true && '--force' || '' }} \
            --ci

      - name: Commit the snapshot
        if: steps.gate.outputs.proceed == 'true' && steps.inspect.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ballot26.csv \
            party_config.py \
            data/transfer_25_to_26.json \
            data/transfer_25_to_26_abstention.json \
            data/all_transfers.json \
            data/all_transfers_abstention.json \
            data/tsne_26.json \
            data/irregularities_26.json \
            site/data/tsne_26.json \
            site/data/map_26.json \
            site/data/transfer_25_to_26.json \
            site/data/transfer_25_to_26_abstention.json \
            site/data/all_transfers.json \
            site/data/all_transfers_abstention.json \
            site/data/fraud_sim_25_26.json \
            site/data/suspects_26.json \
            site/data/command_center_26.json \
            site/data/settlement_sectors.json \
            site/data/irregularities_26.json \
            site/data/turnout_ballots_26.json \
            site/data/wiki_official_results.json \
            site/data/k26_status.json \
            site/data/transfer_ci.json \
            site/dhondt.html \
            site/m/dhondt.html \
            site/party.html \
            site/m/party.html \
            netlify/lib/mcp/mcp-data/settlements_26.json \
            netlify/lib/mcp/mcp-data/embeddings_26.json \
            netlify/lib/mcp/mcp-data/meta.json \
            netlify/lib/mcp/mcp-data/transfers.json
          if git diff --cached --quiet; then
            echo "no file changes"
            exit 0
          fi
          git commit -m "Update K26 from the latest accepted count"
          # The rebuild also rewrites files that are not published (e.g. every
          # tsne_*.json); drop them so the rebase below can run.
          git reset -q --hard
          git clean -fdq
          # Someone may push to master mid-run. Replay on top; on conflicts the
          # freshly generated files (the commit being replayed) win.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
