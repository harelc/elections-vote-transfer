[build]
command = "echo 'Static site'"
publish = "site"

# Results poller — schedule removed 28 Oct 2026: media26 is behind a
# gov.il bot challenge that a plain fetch cannot pass, so the polling
# moved to the GitHub-scheduled k26-refresh workflow (Chrome download
# fallback). The function stays deployed (k26_control.json poll:false
# also gates it) in case it is ever needed manually; re-add a
# `schedule = "*/5 * * * *"` line here to resume Netlify-side polling.
[functions."k26-poll"]
included_files = ["k26_control.json"]

# Election-day turnout poller: every 2 minutes inside the daytime
# turnout window (07:00-22:00 on 27 Oct 2026, gated by k26_control.json);
# dispatch stays off while turnout_auto is false.
[functions."k26-turnout-poll"]
schedule = "*/2 * * * *"
included_files = ["k26_control.json"]

[[headers]]
  for = "/data/k26_status.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Custom function paths plus this catch-all come back as an empty 500
# before the function runs. These two rules hit the default function URL.

[[redirects]]
from = "/mcp"
to = "/.netlify/functions/mcp"
status = 200
force = true

[[redirects]]
from = "/mcp-log"
to = "/.netlify/functions/mcp-log"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
