[build]
command = "echo 'Static site'"
publish = "site"

# Results poller — no schedule: media26 is behind a gov.il bot
# challenge that a plain fetch cannot pass, so refreshing moved to the
# GitHub-scheduled k26-refresh workflow (Chrome download fallback).
# The function stays deployed (k26_control.json poll:false also gates
# it) in case it is ever needed manually.
[functions."k26-poll"]
included_files = ["k26_control.json"]

# Retired after election night: this only dispatches the GitHub count
# refresh, which now runs on its own daily schedule through 9 Nov 2026.
# The function stays deployed for a manual call if ever needed.
[functions."k26-dispatch"]
included_files = ["k26_control.json"]

# Election-day turnout polling is over; the function stays deployed for
# manual/rehearsal use but has no schedule.
[functions."k26-turnout-poll"]
included_files = ["k26_control.json"]

[[headers]]
  for = "/data/k26_status.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Custom function paths plus this catch-all come back as an empty 500
# before the function runs. These two rules hit the default function URL.

[[redirects]]
from = "/mcp"
to = "/.netlify/functions/mcp"
status = 200
force = true

[[redirects]]
from = "/mcp-log"
to = "/.netlify/functions/mcp-log"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
