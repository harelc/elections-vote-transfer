    <style>
        html, body { overflow: auto; height: auto; min-height: 100%; }
        .page-content { padding: 52px 0.7rem calc(60px + var(--safe-bottom)); max-width: 560px; margin: 0 auto; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 0.8rem; }
        .card h3 { font-size: 1rem; color: var(--text-primary); margin-bottom: 0.35rem; }
        .note { font-size: 0.78rem; color: var(--text-muted); line-height: 1.45; }
        /* Provenance: simulated vs real, unmissable like the desktop CC */
        .prov { border: 2px solid; border-radius: 12px; padding: 0.7rem 0.9rem; margin-bottom: 0.8rem; display: flex; gap: 0.6rem; align-items: center; }
        .prov.sim { border-color: #ef4444; color: #fecaca; background: repeating-linear-gradient(45deg, rgba(239,68,68,.16) 0 16px, rgba(239,68,68,.07) 16px 32px); }
        .prov.real { border-color: #22c55e; color: #bbf7d0; background: rgba(34,197,94,.1); }
        .prov.partial { border-color: #f59e0b; color: #fde68a; background: rgba(245,158,11,.1); }
        .prov b { font-size: 0.98rem; }
        .prov .sub { font-size: 0.76rem; opacity: 0.88; line-height: 1.4; }
        /* Count progress */
        .count-big { font-size: 2rem; font-weight: 800; color: var(--text-primary); line-height: 1.1; }
        .count-bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin: 0.5rem 0 0.35rem; }
        .count-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .official .count-bar i { background: linear-gradient(90deg, #16a34a, #4ade80); }
        /* Stacked seat bar */
        .seatbar { display: flex; height: 16px; border-radius: 8px; overflow: hidden; margin: 0.4rem 0 0.7rem; background: rgba(255,255,255,.06); }
        .seatbar i { display: block; height: 100%; }
        /* Party rows */
        .prow { display: grid; grid-template-columns: 10px minmax(0,1fr) auto auto; gap: 0.55rem; align-items: center; padding: 0.42rem 0; border-bottom: 1px solid rgba(255,255,255,.05); }
        .prow:last-child { border-bottom: none; }
        .prow .sw { width: 10px; height: 10px; border-radius: 3px; }
        .prow .nm { min-width: 0; }
        .prow .nm b { display: block; font-size: 0.9rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prow .nm span { font-size: 0.72rem; color: var(--text-muted); }
        .prow .fc { text-align: center; }
        .prow .fc b { display: block; font-size: 1.25rem; color: #22d3ee; line-height: 1.1; }
        .prow .fc span { font-size: 0.66rem; color: var(--text-muted); }
        .prow .st { font-size: 1.3rem; font-weight: 800; color: var(--text-primary); min-width: 2ch; text-align: end; }
        .prow.below { opacity: 0.55; }
        .bloc-line { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.5rem; line-height: 1.7; }
        .bloc-line b { color: var(--text-primary); }
        /* Hemicycle */
        .hemi-wrap svg { width: 100%; height: auto; display: block; }
        .hemi-legend { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; justify-content: center; margin-top: 0.35rem; font-size: 0.74rem; color: var(--text-secondary); }
        .hemi-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 4px; }
        .hemi-toggle { display: flex; gap: 0.4rem; margin-bottom: 0.4rem; }
        .hemi-toggle[hidden] { display: none; }
        .hemi-toggle button { font-family: inherit; font-size: 0.76rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-secondary); border-radius: 999px; padding: 0.3rem 0.7rem; }
        .hemi-toggle button.gold { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
        #sankey-el svg { width: 100%; height: auto; display: block; }
        .gold-btn { display: flex; justify-content: center; align-items: center; width: 100%; padding: 0.85rem 1rem; border-radius: 999px; background: linear-gradient(135deg, #ffd75e, #f0b429); color: #1a1408 !important; font-weight: 800; font-size: 0.95rem; text-decoration: none; border: 1px solid #ffe08a; }
        #cc-map { height: 46vh; min-height: 280px; border-radius: 10px; overflow: hidden; }
        .geo-modes { display: flex; gap: 0.35rem; overflow-x: auto; scrollbar-width: none; margin-bottom: 0.5rem; }
        .geo-modes::-webkit-scrollbar { display: none; }
        .geo-modes button { flex: none; font-family: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-secondary); border-radius: 999px; padding: 0.36rem 0.7rem; }
        .geo-modes button.gold { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
        .geo-party-select { width: 100%; font-family: inherit; font-size: 0.85rem; font-weight: 600; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 0.45rem 0.5rem; margin-bottom: 0.5rem; }
        .geo-party-select[hidden] { display: none; }
        .legend { display: flex; align-items: center; gap: 0.45rem; margin-top: 0.5rem; font-size: 0.7rem; color: var(--text-muted); }
        .legend .grad { flex: 1; height: 9px; border-radius: 999px; background: rgba(255,255,255,.08); }
        .maplibregl-map { background: var(--bg); }
        /* Mode switcher (mirrors the desktop CC view switcher) */
        .mode-switch { display: flex; gap: 0.35rem; align-items: center; overflow-x: auto; scrollbar-width: none; margin-bottom: 0.8rem; }
        .mode-switch::-webkit-scrollbar { display: none; }
        .mode-switch[hidden] { display: none; }
        .mode-switch .ms-label { flex: none; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }
        .mode-switch a { flex: none; font-size: 0.78rem; font-weight: 600; text-decoration: none; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-secondary); border-radius: 999px; padding: 0.34rem 0.7rem; }
        .mode-switch a.gold { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
        /* Cluster icons + sheet rows: same treatment as m/geomap.html */
        .custom-cluster { background: none !important; border: none !important; }
        .custom-cluster .cluster-inner { width: 100%; height: 100%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: 600; border: 2px solid rgba(255,255,255,0.3); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        .cluster-count { font-size: 0.8rem; line-height: 1; text-shadow: 0 0 4px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.9); }
        .cluster-info { font-size: 0.6rem; opacity: 0.85; line-height: 1; text-shadow: 0 0 4px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.9); }
        .cluster-colocated .cluster-inner { border-style: dashed; border-color: rgba(255,255,255,0.6); }
        .sheet-ballot-row { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: var(--bg-tertiary); cursor: pointer; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-primary); }
        .sheet-ballot-row .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .sheet-ballot-row .pct { margin-inline-start: auto; color: var(--text-muted); font-size: 0.75rem; }
        .sheet-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
        .sheet-sub { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; }
        .factoid { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.55; }
        .factoid b { color: var(--accent); }
    </style>
</head>

    <script>i18n.injectLangToggle('.top-bar'); i18n.renderMobileBMC();</script>
    <script>
    (function () {
        'use strict';
        const en = () => i18n.getLang() === 'en';
        const fmt = n => i18n.fmtNum(Math.round(n || 0));
        const F = { cache: 'no-store' };
        const PREVIEW = new URLSearchParams(location.search).get('preview') || '';
        const CC_FILE = PREVIEW === 'partial17' ? '../data/command_center_26_p17.json'
            : PREVIEW === 'partial12' ? '../data/command_center_26_p12.json'
            : '../data/command_center_26.json';
        let status = null, results = [], colors = {}, enNames = {}, cc = null, factIdx = 0, factTimer = null, transferData = null, hemiMode = 'counted';

        async function load() {
            const [st, wiki, transfer] = await Promise.all([
                fetch('../data/k26_status.json', F).then(r => r.ok ? r.json() : null).catch(() => null),
                fetch('../data/wiki_official_results.json', F).then(r => r.ok ? r.json() : {}).catch(() => ({})),
                fetch('../data/transfer_25_to_26.json', F).then(r => r.ok ? r.json() : null).catch(() => null),
            ]);
            status = st || { kind: 'simulated' };
            // Election-day turnout phase has its own mobile view.
            if (status.kind === 'turnout' && !PREVIEW) { location.replace('turnout.html'); return; }
            results = wiki['26'] || [];
            transferData = transfer;
            (transfer && transfer.nodes_to || []).forEach(n => { colors[n.name] = n.color; if (n.info) enNames[n.name] = n.info.name_en || n.name; });
            // The command-center payload also carries geo_all (every
            // ballot box for the map), so fetch it in every mode.
            cc = await fetch(CC_FILE, F).then(r => r.ok ? r.json() : null).catch(() => null);
            if (PREVIEW && cc && cc.nowcast) {
                const nc = cc.nowcast;
                status = { kind: 'partial', ballots: nc.counted_ballots, ballots_total: nc.roster_ballots, as_of: new Date().toISOString() };
            }
            render();
        }

        function name(n) { return en() ? (enNames[n] || n) : n; }

        function render() {
            const kind = status.kind || 'simulated';
            const sim = kind === 'simulated';
            const partial = kind === 'partial';
            // ?preview=* rehearses the election-night layout on simulated
            // data — it must never wear the real-results banner.
            const rehearsal = !!PREVIEW && partial;
            const fake = sim || rehearsal;
            // Provenance
            const prov = document.getElementById('prov');
            prov.className = 'prov ' + (fake ? 'sim' : partial ? 'partial' : 'real');
            document.getElementById('prov-icon').textContent = fake ? '⚠' : '●';
            document.getElementById('prov-title').textContent = rehearsal
                ? (en() ? '⚠ REHEARSAL PREVIEW — simulated data, not real results' : '⚠ תצוגת חזרה — נתונים מדומים, לא תוצאות אמת')
                : sim
                    ? (en() ? '⚠ SIMULATED SCENARIO — not real data' : '⚠ תרחיש מדומה — אלה אינם נתוני אמת')
                    : partial
                        ? (en() ? '● REAL RESULTS — partial CEC count in progress' : '● תוצאות אמת — ספירת ועדת הבחירות בעיצומה')
                        : (en() ? '● OFFICIAL RESULTS — Central Elections Committee' : '● תוצאות רשמיות — ועדת הבחירות המרכזית');
            document.getElementById('prov-sub').textContent = rehearsal
                ? (en() ? 'A rehearsal of the count-night layout on the simulated scenario (about ' + (PREVIEW === 'partial' ? '45' : PREVIEW === 'partial17' ? '17' : '12') + '% counted in the simulation). Nothing here is real.' : 'חזרה על תצוגת ליל הספירה מתוך התרחיש המדומה (כ־' + (PREVIEW === 'partial' ? '45' : PREVIEW === 'partial17' ? '17' : '12') + '% נספרו בסימולציה). שום דבר כאן אינו אמיתי.')
                : sim
                    ? (en() ? 'Knesset 26 has not happened on this page yet: a polling-calibrated simulation, replaced automatically when the CEC publishes real data.' : 'הבחירות לכנסת ה־26 טרם נערכו כאן: סימולציה מכוילת־סקרים, שתוחלף אוטומטית כשועדת הבחירות תפרסם נתוני אמת.')
                    : partial
                        ? (en() ? 'Real ballot boxes counted so far. Figures change as the count proceeds.' : 'קלפיות אמיתיות שנספרו עד כה. הנתונים משתנים ככל שהספירה מתקדמת.')
                        : (en() ? 'Final official K26 results as published by the CEC.' : 'תוצאות סופיות רשמיות של כנסת 26 כפי שפרסמה ועדת הבחירות.');
            // Mode switcher: only while the count is simulated/rehearsed
            // (on a real partial/official night there is one live mode).
            const ms = document.getElementById('mode-switch');
            if (sim || PREVIEW) {
                ms.hidden = false;
                document.getElementById('ms-label').textContent = en() ? 'Mode:' : 'מצב:';
                document.getElementById('ms-day').textContent = en() ? '🗳 Election day' : '🗳 יום הבחירות';
                document.getElementById('ms-full').textContent = en() ? 'Full count' : 'ספירה מלאה';
                ms.querySelectorAll('[data-mode]').forEach(a => {
                    a.classList.toggle('gold', (a.dataset.mode || '') === PREVIEW);
                    a.href = 'k26.html' + (a.dataset.mode ? '?preview=' + a.dataset.mode : '');
                });
                document.getElementById('ms-full').classList.toggle('gold', !PREVIEW);
            } else ms.hidden = true;
            // Count progress
            const cc1 = document.getElementById('count-card');
            if ((partial || kind === 'official') && status.ballots_total) {
                cc1.hidden = false;
                cc1.className = 'card' + (kind === 'official' ? ' official' : '');
                const pct = 100 * (status.ballots || 0) / status.ballots_total;
                document.getElementById('count-title').textContent = kind === 'official'
                    ? (en() ? 'Count complete' : 'הספירה הסתיימה') : (en() ? 'Counting in progress' : 'הספירה בעיצומה');
                document.getElementById('count-pct').textContent = pct.toFixed(1) + '%';
                document.getElementById('count-fill').style.width = pct.toFixed(1) + '%';
                const upd = status.as_of ? new Date(status.as_of).toLocaleString(en() ? 'en-GB' : 'he-IL', { timeZone: 'Asia/Jerusalem', dateStyle: 'medium', timeStyle: 'short' }) : '';
                document.getElementById('count-meta').textContent =
                    `${fmt(status.ballots)} / ${fmt(status.ballots_total)} ${en() ? 'ballot boxes' : 'קלפיות'}` +
                    (partial ? ` · ${fmt(status.ballots_total - (status.ballots || 0))} ${en() ? 'remaining' : 'נותרו'}` : '') +
                    (upd ? ` · ${en() ? 'updated' : 'עודכן'} ${upd}` : '');
            } else cc1.hidden = true;
            // Seats
            document.getElementById('seats-title').textContent = partial
                ? (en() ? 'Seats — counted so far' : 'מנדטים — לפי הספירה החלקית')
                : (en() ? 'Seats' : 'מנדטים');
            const totalVotes = results.reduce((a, p) => a + (p.votes || 0), 0);
            renderHemi();
            document.getElementById('party-rows').innerHTML = results.map(p => `
                <div class="prow${p.seats ? '' : ' below'}">
                    <span class="sw" style="background:${colors[p.name] || '#666'}"></span>
                    <span class="nm"><b>${name(p.name)}</b><span>${fmt(p.votes)} ${en() ? 'votes' : 'קולות'} · ${totalVotes ? (100 * p.votes / totalVotes).toFixed(1) : '0.0'}%</span></span>
                    <span></span><span class="st">${p.seats || ''}</span>
                </div>`).join('');
            document.getElementById('bloc-line').textContent = '';
            renderMap();
            renderNowcast();
            renderFactoid();
            document.getElementById('desktop-link').textContent = en() ? 'Full command centre (desktop) ↗' : 'למרכז הבקרה המלא (מחשב) ↗';
        }

        // Hemicycle: same geometry as the desktop CC (6 arc rows,
        // party wedges ordered left-wing -> right-wing), no MK names.
        const ARC_ORDER = ['הרשימה המשותפת','רע״ם','הדמוקרטים','ישר','ביחד','ישראל ביתנו','המילואימניקים והכלכלית','הליכוד','ציונות הדתית','הציונות הדתית','עוצמה יהודית','עמך ישראל','יהדות התורה','ש״ס'];
        function seatMap() {
            const m = {};
            if (hemiMode === 'forecast' && cc && cc.nowcast && cc.nowcast.projection) {
                cc.nowcast.projection.parties.forEach(p => m[p.name] = p.proj_seats ?? Math.round(p.median) ?? 0);
            } else results.forEach(p => m[p.name] = p.seats || 0);
            return m;
        }
        function renderHemi() {
            const wrapEl = document.getElementById('hemi-wrap');

                .map(p => ({ ...p, seats: sm[p.name] }))
                .sort((a, b) => { const ia = ARC_ORDER.indexOf(a.name), ib = ARC_ORDER.indexOf(b.name); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });

            raw.map((v, i) => [v - counts[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rem-- > 0) counts[i]++; });
            const pos = [];
            radii.forEach((r, i) => { for (let k = 0; k < counts[i]; k++) { const a = Math.PI - (counts[i] === 1 ? 0.5 : k / (counts[i] - 1)) * Math.PI; pos.push({ a, r }); } });

            renderSankey();
        }

        // Compact Sankey (port of the desktop renderer, no tooltips):

                : (en() ? 'National estimate from matched ballots, not a count of people' : 'אומדן לאומי מהקלפיות המוצלבות, לא ספירת אנשים') + (r2 != null ? ` · R² = ${Number(r2).toFixed(2)}` : '');
            const el = document.getElementById('sankey-el');

            const W = el.clientWidth || 340, H = 560;
            const margin = { top: 10, right: 66, bottom: 10, left: 66 };
            const innerW = W - margin.left - margin.right, innerH = H - margin.top - margin.bottom;
            const nodes = [
                ...data.nodes_from.map((n, i) => ({ ...n, id: 'from_' + i, side: 'from' })),
                ...data.nodes_to.map((n, i) => ({ ...n, id: 'to_' + i, side: 'to' })),
            ];
            const byNameSide = {}; nodes.forEach((n, i) => { byNameSide[n.name + '_' + n.side] = i; });
            const links = data.transfers.map(tr => {
                const s = byNameSide[tr.source + '_from'], tg = byNameSide[tr.target + '_to'];
                return (s === undefined || tg === undefined) ? null : { source: nodes[s].id, target: nodes[tg].id, value: tr.votes };

            const svg = d3.select(el).append('svg').attr('width', W).attr('height', H);

            const gen = d3.sankey().nodeId(d => d.id).nodeWidth(14).nodePadding(10).nodeAlign(d3.sankeyJustify).extent([[0, 0], [innerW, innerH]]);
            const graph = gen({ nodes: nodes.filter(n => linked.has(n.id)).map(d => ({ ...d })), links: links.map(d => ({ ...d })) });
            if (i18n.isRTL()) graph.nodes.forEach(n => { const x0 = innerW - n.x1; n.x1 = innerW - n.x0; n.x0 = x0; });
            ['from', 'to'].forEach(side => {
                const col = graph.nodes.filter(n => n.side === side).sort((a, b) => (b.votes || 0) - (a.votes || 0));
                const totalVotes = d3.sum(col, n => n.votes || 1), pad = 8, avail = innerH - (col.length - 1) * pad;
                let y = 0;
                col.forEach(n => { const h = Math.max(2, ((n.votes || 1) / totalVotes) * avail); n.y0 = y; n.y1 = y + h; y += h + pad; });
            });
            graph.nodes.forEach(node => {
                const nodeH = node.y1 - node.y0;
                if (node.sourceLinks && node.sourceLinks.length) {
                    const tot = d3.sum(node.sourceLinks, l => l.value);
                    node.sourceLinks.sort((a, b) => ((a.target.y0 + a.target.y1) / 2) - ((b.target.y0 + b.target.y1) / 2));
                    let sy = node.y0;
                    node.sourceLinks.forEach(l => { l.width = Math.max(0.5, tot > 0 ? (l.value / tot) * nodeH : 0); l.y0 = sy + l.width / 2; sy += l.width; });
                }
                if (node.targetLinks && node.targetLinks.length) {
                    const tot = d3.sum(node.targetLinks, l => l.value);
                    node.targetLinks.sort((a, b) => ((a.source.y0 + a.source.y1) / 2) - ((b.source.y0 + b.source.y1) / 2));
                    let ty = node.y0;
                    node.targetLinks.forEach(l => { l.width = Math.max(0.5, tot > 0 ? (l.value / tot) * nodeH : 0); l.y1 = ty + l.width / 2; ty += l.width; });
                }
            });
            const defs = svg.append('defs');
            graph.links.forEach((l, i) => {
                const grad = defs.append('linearGradient').attr('id', 'mk-lg-' + i).attr('gradientUnits', 'userSpaceOnUse')
                    .attr('x1', l.source.x1).attr('y1', 0).attr('x2', l.target.x0).attr('y2', 0);
                grad.append('stop').attr('offset', '0%').attr('stop-color', l.source.color || '#6b7280');
                grad.append('stop').attr('offset', '100%').attr('stop-color', l.target.color || '#6b7280');
            });
            g.append('g').selectAll('path').data(graph.links).join('path')
                .attr('d', d3.sankeyLinkHorizontal()).attr('fill', 'none')
                .attr('stroke', (d, i) => `url(#mk-lg-${i})`).style('stroke-opacity', .4)

                .attr('x', d => d.x0).attr('y', d => d.y0).attr('width', d => d.x1 - d.x0).attr('height', d => Math.max(1, d.y1 - d.y0))
                .attr('fill', d => d.color || '#666').attr('stroke', 'rgba(0,0,0,.3)');
            const rtl = i18n.isRTL();
            g.append('g').selectAll('text').data(graph.nodes).join('text')
                .attr('x', d => rtl ? (d.side === 'from' ? d.x1 + 5 : d.x0 - 5) : (d.side === 'from' ? d.x0 - 5 : d.x1 + 5))

        // Ballot map in every mode, from geo_all in the command-center

        function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }

        }
        function embedCol(d) {
            if (!embedRange || d.x == null) return '#6b7280';
            const { minX, maxX, minY, maxY } = embedRange;
            return `rgb(${embedRGB((d.x - minX) / (maxX - minX), (d.y - minY) / (maxY - minY)).join(',')})`;
        }
        function partyPct(d, idx) {
            const hit = (d.top || []).find(([i]) => i === idx);
            return hit ? hit[1] : 0;
        }
        let partyScaleCache = {};
        function partyScale(idx) {
            if (partyScaleCache[idx]) return partyScaleCache[idx];
            const vals = geoRows().map(a => { const h = (a[13] || []).find(([i]) => i === idx); return h ? h[1] : 0; }).sort((a, b) => a - b);
            const p95 = vals.length ? vals[Math.floor(vals.length * 0.95)] : 50;

            return partyScaleCache[idx];
        }
        function geoParties() { return (cc && cc.geo_all && cc.geo_all.parties) || []; }
        function geoRows() { return (cc && cc.geo_all && cc.geo_all.rows) || []; }
        function stationColor(d) {
            if (!d.counted) return '#4b5563';
            const parties = geoParties();
            if (geoMode === 'turnout') return turnoutCol(d.t || 0);
            if (geoMode === 'socio') return d.cluster ? SOCIO_COLORS[Math.min(10, Math.max(1, d.cluster)) - 1] : '#374151';
            if (geoMode === 'embed') return embedCol(d);
            if (geoMode === 'party') {
                const col = (parties[geoPartyIdx] || {}).color || '#999';
                return interpHex(lighten(col, 0.85), col, Math.min(partyPct(d, geoPartyIdx) / partyScale(geoPartyIdx), 1));
            }

        }
        function showSheet(html) {
            document.getElementById('sheet-content').innerHTML = html;
            document.getElementById('sheet-backdrop').classList.add('visible');
            document.getElementById('bottom-sheet').classList.add('visible');
        }
        function hideSheet() {
            document.getElementById('sheet-backdrop').classList.remove('visible');
            document.getElementById('bottom-sheet').classList.remove('visible');
        }
        document.getElementById('sheet-backdrop').onclick = hideSheet;
        // Same fuller card as m/geomap.html's station sheet.
        function stationSheet(d) {
            const parties = geoParties();
            if (!d.counted) {
                showSheet(`<div class="sheet-title">${i18n.settlementName(d.name)}</div>
                    <div class="sheet-sub">${en() ? 'Ballot' : 'קלפי'} ${d.ballot}<br>${en() ? 'Not counted yet' : 'טרם נספרה'}</div>`);
                return;
            }
            const partyHtml = (d.top || []).map(([idx, pct]) => {
                const p = parties[idx] || {};
                return `<div class="party-row">
                    <span class="party-dot" style="background:${p.color || '#939aab'}"></span>
                    <span class="party-name">${i18n.partyName(p.name || '')}</span>
                    <span class="party-pct">${Math.round(pct)}%</span>

                </div>`;
            }).join('');
            showSheet(`
                <div style="font-weight:600;font-size:1rem;margin-bottom:2px;">${i18n.settlementName(d.name)}</div>
                <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:8px;">
                    ${en() ? 'Ballot' : 'קלפי'} ${d.ballot}${d.venue ? ' · ' + d.venue : ''}${d.cluster ? ' · ' + (en() ? 'socioeconomic cluster' : 'אשכול חברתי־כלכלי') + ' ' + d.cluster : ''}

                    <span class="label">${en() ? 'Turnout' : 'אחוז הצבעה'}</span><span class="value">${d.t}%</span>
                </div>
                ${partyHtml}
                <div style="margin-top:10px;">
                    <a href="settlement.html?name=${encodeURIComponent(d.name)}" style="color:#f0b429;text-decoration:none;font-size:0.85em;">${en() ? 'Settlement profile' : 'לפרופיל היישוב'} &rarr;</a>
                </div>`);
        }
        function clusterIcon(items) {
            const count = items.length;
            const countedItems = items.filter(it => it.station.counted);
            let bg = '#4b5563', info = '';
            const parties = geoParties();
            if (countedItems.length && geoMode === 'winner') {
                const wins = {};
                countedItems.forEach(it => wins[it.station.winnerIdx] = (wins[it.station.winnerIdx] || 0) + 1);
                const sorted = Object.entries(wins).sort((a, b) => b[1] - a[1]);
                info = Math.round(100 * sorted[0][1] / count) + '%';
                let angle = 0; const stops = [];
                sorted.slice(0, 5).forEach(([idx, n]) => { const pct = n / count * 100; stops.push(`${(parties[idx] || {}).color || '#999'} ${angle.toFixed(1)}% ${(angle + pct).toFixed(1)}%`); angle += pct; });
                if (angle < 99.5) stops.push(`#4b5563 ${angle.toFixed(1)}% 100%`);
                bg = `conic-gradient(${stops.join(', ')})`;
            } else if (countedItems.length && geoMode === 'turnout') {
                let sv = 0, se = 0;
                countedItems.forEach(it => { sv += it.station.v || 0; se += it.station.e || 0; });
                const avg = se ? Math.round(100 * sv / se) : 0;
                bg = turnoutCol(avg); info = avg + '%';
            } else if (countedItems.length && geoMode === 'party') {
                let sv = 0, sw = 0;
                countedItems.forEach(it => { sv += partyPct(it.station, geoPartyIdx) * (it.station.v || 0); sw += it.station.v || 0; });
                const avg = sw ? sv / sw : 0;
                const col = (parties[geoPartyIdx] || {}).color || '#999';
                bg = interpHex(lighten(col, 0.85), col, Math.min(avg / partyScale(geoPartyIdx), 1));
                info = Math.round(avg) + '%';
            } else if (countedItems.length && geoMode === 'socio') {
                const counts = {};
                countedItems.forEach(it => { if (it.station.cluster) counts[it.station.cluster] = (counts[it.station.cluster] || 0) + 1; });
                const dom = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
                if (dom) { bg = SOCIO_COLORS[Math.min(10, Math.max(1, +dom[0])) - 1]; info = dom[0]; }
            } else if (countedItems.length && geoMode === 'embed') {
                let sx = 0, sy = 0;

                bg = embedCol({ x: sx / countedItems.length, y: sy / countedItems.length });

            const first = items[0];
            const colocated = items.every(it => Math.abs(it.origLat - first.origLat) < 1e-5 && Math.abs(it.origLng - first.origLng) < 1e-5);
            const size = (count > 500 ? 80 : count > 200 ? 70 : count > 100 ? 60 : count > 30 ? 50 : 40) * (colocated ? 0.85 : 1);
            return {
                html: `<div class="cluster-inner" style="background:${bg}"><div class="cluster-count">${count}</div><div class="cluster-info">${info}</div></div>`,
                className: 'custom-cluster' + (colocated ? ' cluster-colocated' : ''), size: Math.round(size)
            };
        }
        function mapItems() {
            const nc = (cc && cc.nowcast) || {};
            const partial = status.kind === 'partial';
            const countedKeys = new Set((nc.geo_counted || []).map(a => a[0] + '|' + a[1]));
            const items = [];
            const piles = new Map();
            const seen = new Set();
            const push = (lat, lng, d) => {
                const rec = { lng, lat, origLng: lng, origLat: lat, color: stationColor(d), radius: d.counted ? 5 : 4, station: d };
                items.push(rec);
                const key = lat.toFixed(5) + ',' + lng.toFixed(5);
                if (!piles.has(key)) piles.set(key, []);
                piles.get(key).push(rec);
            };
            geoRows().forEach(a => {
                const counted = !partial || countedKeys.has(a[0] + '|' + a[1]);
                seen.add(a[0] + '|' + a[1]);
                push(a[2], a[3], {
                    name: a[0], ballot: a[1], winnerIdx: a[4], winnerPct: a[5],
                    v: a[6], e: a[7], t: a[8], venue: a[9] || '', cluster: a[10],
                    x: a[11], y: a[12], top: a[13] || [], counted: counted ? 1 : 0
                });
            });
            if (partial) (nc.geo_uncounted || []).forEach(a => {
                if (seen.has(a[0] + '|' + a[1])) return;
                push(a[2], a[3], { name: a[0], ballot: a[1], counted: 0, top: [] });
            });
            // Spread colocated piles so each box stays tappable
            piles.forEach(group => {
                if (group.length < 2) return;
                group.forEach((rec, i) => {
                    const angle = (2 * Math.PI * i) / group.length;
                    rec.lat += Math.sin(angle) * 0.00012;
                    rec.lng += Math.cos(angle) * 0.00012;

        }
        function paintMap() { if (ccLayer) ccLayer.setStations(mapItems()); }
        function renderMap() {

            if (!ccMap) {
                ccMap = createMap('cc-map', {
                    center: [34.9, 31.4], zoom: 7.4, minZoom: 6.5, maxZoom: 16,
                    basemap: 'positron', zoomPosition: 'bottom-right'
                });
                ccLayer = new StationClusterLayer(ccMap, {
                    clusterHTML: (stations) => clusterIcon(stations),
                    onClusterClick: (stations, lng, lat, clusterId) => {
                        const first = stations[0];
                        const colocated = stations.every(it => Math.abs(it.origLat - first.origLat) < 1e-5 && Math.abs(it.origLng - first.origLng) < 1e-5);
                        if (colocated) {
                            const parties = geoParties();
                            showSheet(`<div class="sheet-title">${i18n.settlementName(first.station.name)}</div>
                                <div class="sheet-sub" style="margin-bottom:8px">${stations.length} ${en() ? 'ballot boxes at this venue — tap one:' : 'קלפיות באותו מקום — הקשה על אחת:'}</div>` +
                                stations.map((it, i) => `<div class="sheet-ballot-row" data-row="${i}"><span class="dot" style="background:${it.color}"></span>${en() ? 'Ballot' : 'קלפי'} ${it.station.ballot}<span class="pct">${it.station.counted ? i18n.partyName((parties[it.station.winnerIdx] || {}).name || '') + ' · ' + it.station.winnerPct + '%' : (en() ? 'not counted' : 'טרם נספרה')}</span></div>`).join(''));
                            document.querySelectorAll('#sheet-content [data-row]').forEach(row => row.onclick = () => stationSheet(stations[+row.dataset.row].station));
                        } else ccLayer.zoomCluster(clusterId, lng, lat);
                    },
                    onStationClick: (item) => stationSheet(item.station)
                });
            }
            paintMap();
            ccMap.resize();
        }
        function renderLegend() {
            const grad = document.getElementById('legend-grad');
            const lo = document.getElementById('legend-lo');
            const hi = document.getElementById('legend-hi');
            const parties = geoParties();
            if (geoMode === 'turnout') {
                grad.style.background = 'linear-gradient(to left, #ef4444, #fbbf24 55%, #10b981)';
                lo.textContent = '40%'; hi.textContent = '90%';
            } else if (geoMode === 'party') {
                const col = (parties[geoPartyIdx] || {}).color || '#999';
                grad.style.background = `linear-gradient(to left, ${col}, ${lighten(col, 0.85)})`;
                lo.textContent = Math.round(partyScale(geoPartyIdx)) + '%'; hi.textContent = '0%';
            } else if (geoMode === 'socio') {
                grad.style.background = `linear-gradient(to left, ${SOCIO_COLORS.join(', ')})`;
                lo.textContent = '10'; hi.textContent = '1';
            } else {
                grad.style.background = 'rgba(255,255,255,.08)';
                lo.textContent = ''; hi.textContent = '';
            }
        }

        function renderNowcast() {
            const card = document.getElementById('nowcast-card');
            const nc = cc && cc.nowcast;
            if (!nc || status.kind !== 'partial') { card.hidden = true; return; }
            card.hidden = false;
            document.getElementById('nc-title').textContent = en() ? 'Nowcast — forecast for the final count' : 'תחזית — לסוף הספירה';
            const gate = document.getElementById('nc-gate');
            const rowsEl = document.getElementById('nc-rows');
            const blocsEl = document.getElementById('nc-blocs');
            if (!nc.ready || !nc.projection) {
                gate.textContent = en() ? '⏳ Too early for a forecast — not enough counted ballots yet.' : '⏳ עדיין מוקדם מדי לתחזית — עוד לא נספרו מספיק קלפיות.';
                rowsEl.innerHTML = ''; blocsEl.textContent = ''; return;
            }
            gate.textContent = en()
                ? `From the ${fmt(nc.counted_ballots)} boxes counted so far and the national transfer model.`
                : `לפי ${fmt(nc.counted_ballots)} הקלפיות שנספרו ומודל המעבר הארצי.`;
            const P = nc.projection;
            const byName = {};
            results.forEach(p => byName[p.name] = p);
            rowsEl.innerHTML = P.parties.filter(p => (p.proj_seats ?? p.median) > 0 || p.seats_now > 0).map(p => `
                <div class="prow${(p.proj_seats ?? 0) ? '' : ' below'}">
                    <span class="sw" style="background:${colors[p.name] || '#666'}"></span>
                    <span class="nm"><b>${name(p.name)}</b><span>${en() ? 'counted' : 'נספרו'} ${p.seats_now} · ${p.p10}–${p.p90}</span></span>
                    <span class="fc"><b>${p.proj_seats ?? Math.round(p.median)}</b><span>${en() ? 'forecast' : 'תחזית'}</span></span>
                    <span class="st">${p.seats_now || ''}</span>
                </div>`).join('');
            const blocName = { right: en() ? 'Right–Haredi' : 'ימין–חרדים', center: en() ? 'Centre–left' : 'מרכז–שמאל', arab: en() ? 'Arab parties' : 'מפלגות ערביות' };
            blocsEl.innerHTML = Object.entries(P.blocs || {}).map(([k, v]) =>
                `${blocName[k] || k} <b>${v.proj_seats ?? Math.round(v.median)}</b>`).join(' · ');
        }

        function renderFactoid() {
            const card = document.getElementById('factoid-card');
            const facts = (cc && cc.factoids) || [];
            if (!facts.length) { card.hidden = true; return; }
            card.hidden = false;
            const show = () => {
                const f = facts[factIdx % facts.length];
                document.getElementById('factoid').innerHTML = `<b>${en() ? 'Did you know?' : 'הידעת?'}</b> ${en() ? (f.en || f.he) : f.he}`;
                factIdx++;
            };
            show();
            if (!factTimer) factTimer = setInterval(show, 7000);
        }

        window.addEventListener('langchange', () => { factIdx = 0; render(); });
        load().catch(() => {
            document.getElementById('prov-title').textContent = en() ? 'Error loading data' : 'שגיאה בטעינת הנתונים';
        });
        // The count moves: refresh every 90 seconds while the page is open.
        setInterval(() => load().catch(() => {}), 90000);
    })();
    </script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="../basemap.js"></script>
    <script src="../station-clusters.js"></script>
    <script src="../webinar-modal.js"></script>
</body>
</html>
