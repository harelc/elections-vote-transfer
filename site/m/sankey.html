    <style>
        .transition-pills {
            display: flex;
            gap: 4px;
            margin-right: auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .transition-pill {
            padding: 4px 8px;
            border-radius: 14px;
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            min-height: 28px;
            white-space: nowrap;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .transition-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #1a1408;
        }

        .transition-pill .arrow { opacity: 0.5; font-size: 0.6rem; }

        /* Sankey area — vertically scrollable so a tall chart is never
           trapped beneath the screen on small phones */
        #main-area {
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        #sankey-chart {
            width: 100%;
            display: block;
        }

        .sankey-link {
            fill: none;
            stroke-opacity: 0.35;
            cursor: pointer;
        }

        .sankey-link.highlighted { stroke-opacity: 0.7; }
        .sankey-link.dimmed { stroke-opacity: 0.08; }

        .sankey-node text {
            font-family: 'Heebo', sans-serif;
            fill: var(--text-primary);
            pointer-events: none;
        }

        .sankey-node rect {
            cursor: pointer;
        }

        /* Election info strip */
        .election-strip {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
        }

        .election-strip .side {
            text-align: center;
        }

        .election-strip .side .name {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .election-strip .side .date {
            color: var(--text-muted);
        }

        .election-strip .arrow-mid {
            color: var(--accent);
            font-size: 1.2rem;
        }

        /* Percent toggle */
        .pct-toggle {
            position: fixed;
            bottom: calc(54px + var(--safe-bottom));
            right: 8px;
            z-index: 400;
            display: flex;
            gap: 6px;
        }

        .pct-toggle button {
            padding: 6px 12px;
            border-radius: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.7rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .pct-toggle button:active { background: var(--bg-hover); }

        /* Legend FAB */
        .legend-fab {
            bottom: calc(54px + var(--safe-bottom));
            left: 8px;
        }
    </style>

    <script>
    // Political spectrum order (right → left, Arab parties, non-voters
    // last) — mirrors sankey.js so columns stack by bloc, not by size.
    const POLITICAL_ORDER = [
        'נעם', 'עוצמה יהודית', 'הציונות הדתית', 'הבית היהודי', 'הימין החדש',
        'ימינה', 'האיחוד הלאומי', 'עמך ישראל', 'הליכוד', 'הליכוד ישראל ביתנו',
        'ישראל בעלייה', 'ש״ס', 'יהדות התורה', 'הציבור החרדי',
        'ביחד', 'ישר', 'יש עתיד', 'ישראל ביתנו', 'תקווה חדשה', 'המחנה הממלכתי', 'כחול לבן',
        'כולנו', 'המילואימניקים והכלכלית', 'קדימה', 'התנועה', 'שינוי', 'גיל',
        'הגמלאים', 'הדמוקרטים', 'המחנה הציוני', 'העבודה', 'עם אחד', 'מרצ',
        'הרשימה המשותפת', 'חד״ש-תע״ל', 'חד״ש', 'בל״ד', 'רע״ם',
        'לא הצביעו',
    ];
    function politicalRank(name) {
        const i = POLITICAL_ORDER.indexOf(name);
        return i === -1 ? POLITICAL_ORDER.length - 1.5 : i;
    }

    class MobileSankey {
        constructor() {
            this.currentTransition = (typeof i18n !== 'undefined' && i18n.SHOW_E26) ? '25_to_26' : '24_to_25';
            this.data = null;
            this.officialResults = null;
            this.percentMode = 'source';
            this.abstentionMode = false;
            this.defaultTransition = this.currentTransition;
            // Deep link: ?t=24_to_25&pct=target&abst=1 (same names as desktop)
            if (window.DL) {
                const valid = [];
                for (let i = 16; i < 26; i++) valid.push(`${i}_to_${i + 1}`);
                const t = DL.get('t');
                if (valid.includes(t) && (t !== '25_to_26' || i18n.SHOW_E26)) this.currentTransition = t;
                if (DL.get('pct') === 'target') this.percentMode = 'target';
                if (DL.get('abst') === '1') this.abstentionMode = true;
            }
            this.flowCI = null;
            this.flowCIFile = null;
            this.noAbstentionTransitions = ['16_to_17', '17_to_18'];
            this.nodes = null;
            this.links = null;

            this.initPills();
            this.initEvents();
            this.loadOfficialResults().then(() => this.loadTransition(this.currentTransition));
        }

        initPills() {
            const pills = document.getElementById('transition-pills');
            const transitions = [
                { id: '16_to_17', from: '16', to: '17' },
                { id: '17_to_18', from: '17', to: '18' },
                { id: '18_to_19', from: '18', to: '19' },
                { id: '19_to_20', from: '19', to: '20' },
                { id: '20_to_21', from: '20', to: '21' },
                { id: '21_to_22', from: '21', to: '22' },
                { id: '22_to_23', from: '22', to: '23' },
                { id: '23_to_24', from: '23', to: '24' },
                { id: '24_to_25', from: '24', to: '25' }
            ];
            if (i18n.SHOW_E26) transitions.push({ id: '25_to_26', from: '25', to: '26' });
            transitions.forEach(t => {
                const btn = document.createElement('button');
                btn.className = 'transition-pill' + (t.id === this.currentTransition ? ' active' : '');
                btn.innerHTML = `${t.from}<span class="arrow">←</span>${t.to}`;
                btn.dataset.transition = t.id;
                btn.onclick = () => {
                    this.currentTransition = t.id;
                    document.querySelectorAll('.transition-pill').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    this.loadTransition(t.id);
                };
                pills.appendChild(btn);
            });
            // Animation link
            const animBtn = document.createElement('a');
            animBtn.href = '../animation.html' + (i18n.SHOW_E26 ? '' : '?e26=0');
            animBtn.className = 'transition-pill';
            animBtn.style.cssText = 'background:#f0b429;color:#1a1408;text-decoration:none;';
            animBtn.textContent = '▶';
            pills.appendChild(animBtn);
        }

        initEvents() {
            document.getElementById('sheet-backdrop').onclick = () => this.hideSheet();

            // Percent toggle
            document.getElementById('pct-btn').onclick = () => {
                this.percentMode = this.percentMode === 'source' ? 'target' : 'source';
                document.getElementById('pct-btn').textContent =
                    i18n.t(this.percentMode === 'source' ? 'pct_prev_short' : 'pct_next_short');
                this.syncDL();
            };
            // Labels reflect state, not a fixed string: drop data-i18n so
            // applyTranslations() doesn't overwrite them on language change.
            const pctBtn = document.getElementById('pct-btn');
            pctBtn.removeAttribute('data-i18n');
            pctBtn.textContent =
                i18n.t(this.percentMode === 'source' ? 'pct_prev_short' : 'pct_next_short');
            const abstBtn = document.getElementById('abstention-btn');
            abstBtn.removeAttribute('data-i18n');
            abstBtn.textContent =
                i18n.t(this.abstentionMode ? 'abstention_on_short' : 'abstention_off_short');
            if (window.DL) DL.addCopyButton('.top-bar');

            // Abstention toggle
            document.getElementById('abstention-btn').onclick = () => {
                this.abstentionMode = !this.abstentionMode;
                document.getElementById('abstention-btn').textContent =
                    i18n.t(this.abstentionMode ? 'abstention_on_short' : 'abstention_off_short');
                this.loadTransition(this.currentTransition);
            };

            // Legend button
            document.getElementById('legend-btn').onclick = () => this.showLegendSheet();

            // Resize
            let timer;
            window.addEventListener('resize', () => {
                clearTimeout(timer);
                timer = setTimeout(() => { if (this.data) this.render(); }, 250);
            });
        }

        async loadOfficialResults() {
            try {
                const res = await fetch('../data/wiki_official_results.json');
                this.officialResults = await res.json();
            } catch (e) { console.warn('No official results', e); }
        }

        syncDL() {
            if (window.DL) DL.sync(
                { t: this.currentTransition, pct: this.percentMode, abst: this.abstentionMode ? '1' : null },
                { t: this.defaultTransition, pct: 'source' });
        }

        async loadTransition(id) {
            this.currentTransition = id;
            this.syncDL();
            document.getElementById('loading').style.display = 'flex';
            // Disable abstention for transitions with unreliable data
            const abstentionDisabled = this.noAbstentionTransitions.includes(id);
            const abBtn = document.getElementById('abstention-btn');
            if (abstentionDisabled && this.abstentionMode) {
                this.abstentionMode = false;
                if (abBtn) abBtn.textContent = i18n.t('abstention_off_short');
            }
            if (abBtn) {
                abBtn.disabled = abstentionDisabled;
                abBtn.style.opacity = abstentionDisabled ? '0.4' : '';
            }
            try {
                const suffix = this.abstentionMode ? '_abstention' : '';
                const res = await fetch(`../data/transfer_${id}${suffix}.json`);
                this.data = await res.json();
                await this.loadFlowCI();
                const ci = (this.flowCIFile.transitions || {})[id + suffix];
                const stats = this.data.stats || {};
                const stale = ci && ci.common_precincts != null &&
                    (ci.common_precincts !== stats.common_precincts || ci.r_squared !== stats.r_squared);
                this.flowCI = ci && !stale ? ci : null;
                this.updateElectionStrip();
                this.render();
            } catch (e) { console.error(e); }
            document.getElementById('loading').style.display = 'none';
        }

        async loadFlowCI() {
            if (this.flowCIFile) return;
            try {
                const res = await fetch('../data/transfer_ci.json');
                this.flowCIFile = res.ok ? await res.json() : { transitions: {} };
            } catch (e) {
                this.flowCIFile = { transitions: {} };
            }
        }

        fmtDate(el) {
            const d = new Date(el.date);
            if (isNaN(d)) return el.date;
            const isHe = i18n.getLang() === 'he';
            const s = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
            return el.estimated ? `${s} (${isHe ? 'משוער' : 'estimated'})` : s;
        }

        updateElectionStrip() {
            const strip = document.getElementById('election-strip');
            strip.style.display = 'flex';
            document.getElementById('from-name').textContent = i18n.electionName(this.data.from_election);
            document.getElementById('from-date').textContent = this.fmtDate(this.data.from_election);
            document.getElementById('to-name').textContent = i18n.electionName(this.data.to_election);
            document.getElementById('to-date').textContent = this.fmtDate(this.data.to_election);

            // Adjust main area top
            const mainArea = document.getElementById('main-area');
            mainArea.style.top = (44 + strip.offsetHeight) + 'px';
        }

        render() {
            const container = document.getElementById('main-area');
            container.scrollTop = 0;
            const width = container.clientWidth;
            // Minimum height so every node gets a legible slot; the area
            // scrolls vertically when this exceeds the visible height.
            const maxNodes = Math.max(this.data.nodes_from.length, this.data.nodes_to.length);
            const height = Math.max(container.clientHeight, maxNodes * 38 + 20);

            const margin = { top: 10, right: 45, bottom: 10, left: 45 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            d3.select('#sankey-chart').selectAll('*').remove();

            const svg = d3.select('#sankey-chart')
                .attr('width', width)
                .attr('height', height);

            const g = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            // Build nodes & links
            const nodesFrom = this.data.nodes_from.map((n, i) => ({
                ...n, id: `from_${i}`, side: 'from'
            }));
            const nodesTo = this.data.nodes_to.map((n, i) => ({
                ...n, id: `to_${i}`, side: 'to'
            }));
            const allNodes = [...nodesFrom, ...nodesTo];

            const nodeMap = {};
            allNodes.forEach(n => nodeMap[n.id] = n);

            const links = (this.data.transfers || []).map(t => {
                const srcIdx = nodesFrom.findIndex(n => n.name === t.source || n.symbol === t.source_symbol);
                const tgtIdx = nodesTo.findIndex(n => n.name === t.target || n.symbol === t.target_symbol);
                if (srcIdx < 0 || tgtIdx < 0 || !t.votes) return null;
                const ci = this.flowCI && this.flowCI.cells[`${t.source}\t${t.target}`];
                return {
                    source: `from_${srcIdx}`,
                    target: `to_${tgtIdx}`,
                    value: t.votes,
                    percentage: t.percentage,
                    sourceName: t.source,
                    targetName: t.target,
                    ciLow: ci ? ci[0] : null,
                    ciHigh: ci ? ci[1] : null
                };
            }).filter(Boolean);

            // Sankey layout
            const sankey = d3.sankey()
                .nodeId(d => d.id)
                .nodeWidth(16)
                .nodePadding(8)
                .nodeAlign(d3.sankeyJustify)
                .extent([[0, 0], [innerWidth, innerHeight]]);

            const graph = sankey({
                nodes: allNodes.map(d => ({ ...d })),
                links: links.map(d => ({ ...d }))
            });

            // RTL flip
            graph.nodes.forEach(node => {
                const x0 = innerWidth - node.x1;
                const x1 = innerWidth - node.x0;
                node.x0 = x0;
                node.x1 = x1;
            });

            // Restack both columns in political order (not by size),
            // each filling the full height — same normalisation as the
            // desktop sankey.js, minimising link crossings.
            ['from', 'to'].forEach(side => {
                const col = graph.nodes.filter(n => n.side === side);
                col.sort((a, b) =>
                    (politicalRank(a.name) - politicalRank(b.name)) ||
                    ((b.value || 0) - (a.value || 0)));
                const total = d3.sum(col, n => n.value || 1);
                const pad = 8, avail = innerHeight - (col.length - 1) * pad;
                let y = 0;
                col.forEach(n => {
                    const h = Math.max(2, ((n.value || 1) / total) * avail);
                    n.y0 = y; n.y1 = y + h; y += h + pad;
                });
            });
            graph.nodes.forEach(node => {
                const nodeH = node.y1 - node.y0;
                if (node.sourceLinks && node.sourceLinks.length) {
                    const tot = d3.sum(node.sourceLinks, l => l.value);
                    node.sourceLinks.sort((a, b) => ((a.target.y0 + a.target.y1) / 2) - ((b.target.y0 + b.target.y1) / 2));
                    let sy = node.y0;
                    node.sourceLinks.forEach(l => { l.width = Math.max(0.5, tot > 0 ? (l.value / tot) * nodeH : 0); l.y0 = sy + l.width / 2; sy += l.width; });
                }
                if (node.targetLinks && node.targetLinks.length) {
                    const tot = d3.sum(node.targetLinks, l => l.value);
                    node.targetLinks.sort((a, b) => ((a.source.y0 + a.source.y1) / 2) - ((b.source.y0 + b.source.y1) / 2));
                    let ty = node.y0;
                    node.targetLinks.forEach(l => { l.width = Math.max(0.5, tot > 0 ? (l.value / tot) * nodeH : 0); l.y1 = ty + l.width / 2; ty += l.width; });
                }
            });

            // Draw links
            this.links = g.append('g')
                .selectAll('.sankey-link')
                .data(graph.links)
                .join('path')
                .attr('class', 'sankey-link')
                .attr('d', d3.sankeyLinkHorizontal())
                .attr('stroke', d => d.target.color || '#6b7280')
                .attr('stroke-width', d => Math.max(1, d.width))
                .on('click', (event, d) => this.showFlowSheet(d));

            // Draw nodes
            this.nodes = g.append('g')
                .selectAll('.sankey-node')
                .data(graph.nodes)
                .join('g')
                .attr('class', 'sankey-node')
                .attr('transform', d => `translate(${d.x0},${d.y0})`);

            this.nodes.append('rect')
                .attr('width', d => d.x1 - d.x0)
                .attr('height', d => Math.max(1, d.y1 - d.y0))
                .attr('fill', d => d.color || '#6b7280')
                .attr('rx', 3)
                .on('click', (event, d) => this.showPartySheet(d));

            // Labels
            this.nodes.append('text')
                .attr('x', d => d.side === 'from' ? (d.x1 - d.x0) + 5 : -5)
                .attr('y', d => (d.y1 - d.y0) / 2)
                .attr('dy', '0.35em')
                .attr('text-anchor', d => d.side === 'from' ? 'start' : 'end')
                .text(d => {
                    const h = d.y1 - d.y0;
                    if (h < 12) return '';
                    return i18n.partyName(d);
                })
                .style('font-size', '9px')
                .style('font-weight', '500');

            // Touch highlight: tap node to highlight flows
            this.nodes.on('click', (event, d) => {
                event.stopPropagation();
                this.highlightNode(d);
                this.showPartySheet(d);
            });

            // Tap background to reset
            svg.on('click', () => this.resetHighlight());
        }

        highlightNode(node) {
            const connected = new Set([node.id]);
            const connectedLinks = new Set();

            this.links.each(function(d) {
                if (d.source.id === node.id || d.target.id === node.id) {
                    connectedLinks.add(this);
                    connected.add(d.source.id);
                    connected.add(d.target.id);
                }
            });

            this.links.attr('class', function(d) {
                return 'sankey-link ' + (connectedLinks.has(this) ? 'highlighted' : 'dimmed');
            });
            this.nodes.style('opacity', d => connected.has(d.id) ? 1 : 0.3);
        }

        resetHighlight() {
            if (!this.links) return;
            this.links.attr('class', 'sankey-link');
            this.nodes.style('opacity', 1);
        }

        // ---- Bottom Sheets ----

        showFlowSheet(link) {
            const reversePercent = link.target.votes > 0
                ? ((link.value / link.target.votes) * 100).toFixed(1) : 0;
            const pct = this.percentMode === 'source' ? link.percentage : reversePercent;
            const srcName = i18n.partyName(link.sourceName);
            const tgtName = i18n.partyName(link.targetName);
            const desc = this.percentMode === 'source'
                ? i18n.t('from_votes_of', { party: srcName })
                : i18n.t('from_votes_of_new', { party: tgtName });
            let ciText = '';
            if (link.ciLow != null && link.ciHigh != null) {
                let lo = link.ciLow, hi = link.ciHigh;
                if (this.percentMode !== 'source' && link.percentage) {
                    const scale = parseFloat(reversePercent) / link.percentage;
                    lo *= scale;
                    hi *= scale;
                }
                const fmt = v => {
                    const capped = Math.min(100, Math.max(0, v));
                    return (Math.round(capped * 10) / 10).toFixed(1);
                };
                const draws = this.flowCI && this.flowCI.B;
                const note = draws && draws < this.flowCIFile.B ? ` (${i18n.t('ci_draws', { n: draws })})` : '';
                ciText = `${i18n.t('ci_95')}: ${fmt(Math.min(lo, hi))}–${fmt(Math.max(lo, hi))}${note}`;
            }

            document.getElementById('sheet-content').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;">
                    <span style="display:flex;align-items:center;gap:4px;">
                        <span class="party-dot" style="background:${link.source.color}"></span>
                        <strong>${srcName}</strong>
                    </span>
                    <span style="color:var(--text-muted);">←</span>
                    <span style="display:flex;align-items:center;gap:4px;">
                        <span class="party-dot" style="background:${link.target.color}"></span>
                        <strong>${tgtName}</strong>
                    </span>
                </div>
                <div style="text-align:center;font-size:2rem;font-weight:700;color:var(--accent);margin:8px 0;">${pct}%</div>
                <div style="text-align:center;color:var(--text-secondary);font-size:0.85rem;margin-bottom:8px;">${desc}</div>
                ${ciText ? `<div style="text-align:center;color:var(--text-muted);font-size:0.8rem;margin-bottom:8px;">${ciText}</div>` : ''}
                <div style="text-align:center;color:var(--text-muted);font-size:0.8rem;padding-top:8px;border-top:1px solid var(--border);">
                    ${i18n.fmtNum(link.value)} ${i18n.t('votes')}
                </div>
            `;
            this.showSheet();
        }

        showPartySheet(node) {
            const info = node.info || {};
            const pName = i18n.partyName(node);
            const lName = i18n.leaderName(info);
            const altName = i18n.getLang() === 'he' ? (info.name_en || '') : (node.name || '');
            const elType = node.side === 'from' ? i18n.t('prev_election') : i18n.t('new_election');

            document.getElementById('sheet-content').innerHTML = `
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                    <span class="party-dot" style="background:${node.color};width:14px;height:14px;"></span>
                    <strong style="font-size:1.1rem;">${pName}</strong>
                    ${altName ? `<span style="color:var(--text-muted);font-size:0.8rem;">${altName}</span>` : ''}
                </div>
                ${lName ? `
                <div style="display:flex;align-items:center;gap:10px;padding:8px;background:var(--bg-tertiary);border-radius:8px;margin-bottom:8px;">
                    ${info.leader_image ? `<img src="../${info.leader_image}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none'">` : ''}
                    <div>
                        <div style="font-size:0.7rem;color:var(--text-muted);">${i18n.t('leader_label')}</div>
                        <div style="font-weight:500;">${lName}</div>
                    </div>
                </div>` : ''}
                <div class="stat-grid">
                    <span class="label">${elType}</span><span class="value">${i18n.fmtNum(node.votes)} ${i18n.t('votes')}</span>
                    ${node.seats ? `<span class="label">${i18n.t('seats')}</span><span class="value">${node.seats}</span>` : ''}
                </div>
                ${info.ideology ? `<div style="font-size:0.8rem;color:var(--text-secondary);margin-top:6px;">${info.ideology}</div>` : ''}
                ${info.description ? `<div style="font-size:0.75rem;color:var(--text-muted);margin-top:6px;line-height:1.4;">${info.description}</div>` : ''}
            `;
            this.showSheet();
        }

        showLegendSheet() {
            if (!this.data) return;

            const makeList = (parties, electionObj) => {
                const sorted = [...parties].sort((a, b) => b.votes - a.votes);
                return `
                    <div style="font-weight:600;margin:10px 0 6px;font-size:0.85rem;">${i18n.electionName(electionObj)}</div>
                    ${sorted.map(p => `
                        <div class="party-row">
                            <span class="party-dot" style="background:${p.color}"></span>
                            <span class="party-name">${i18n.partyName(p)}</span>
                            <span class="party-pct">${i18n.fmtNum(p.votes)}</span>
                            <span style="font-size:0.75rem;color:${p.seats > 0 ? 'var(--accent)' : 'var(--text-muted)'};min-width:45px;text-align:left;">
                                ${p.seats > 0 ? p.seats + ' ' + i18n.t('seats') : i18n.t('below_threshold')}
                            </span>
                        </div>
                    `).join('')}
                `;
            };

            document.getElementById('sheet-content').innerHTML =
                makeList(this.data.nodes_from, this.data.from_election) +
                makeList(this.data.nodes_to, this.data.to_election);
            this.showSheet();
        }

        showSheet() {
            document.getElementById('sheet-backdrop').classList.add('visible');
            document.getElementById('bottom-sheet').classList.add('visible');
        }

        hideSheet() {
            document.getElementById('sheet-backdrop').classList.remove('visible');
            document.getElementById('bottom-sheet').classList.remove('visible');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const app = new MobileSankey();

        // Language change listener
        window.addEventListener('langchange', () => {
            document.getElementById('pct-btn').textContent =
                i18n.t(app.percentMode === 'source' ? 'pct_prev_short' : 'pct_next_short');
            document.getElementById('abstention-btn').textContent =
                i18n.t(app.abstentionMode ? 'abstention_on_short' : 'abstention_off_short');
            if (app.data) {
                app.updateElectionStrip();
                app.render();
            }
        });

        // Info / About button
        document.getElementById('info-btn').onclick = () => {
            document.getElementById('sheet-content').innerHTML = `
                <div class="about-sheet">
                    <h3>${i18n.t('about_this_view')}</h3>
                    <p>${i18n.t('sankey_info')}</p>

                    <h3>${i18n.t('about_site')}</h3>
                    <p>${i18n.t('about_description')}</p>

                    <h3>${i18n.t('license')}</h3>
                    <p>CC BY-NC-SA 4.0 &nbsp;|&nbsp; ${i18n.t('credits_line')}</p>
                    <p><a href="https://github.com/harelkain/elections-vote-transfer" target="_blank">${i18n.t('source_code')}</a></p>

                    <a href="https://www.buymeacoffee.com/harelc" target="_blank" class="bmc-inline">
                        <img src="https://cdn.buymeacoffee.com/buttons/bmc-new-btn-logo.svg" alt="">
                        <span>${i18n.t('bmc_title')}</span>
                    </a>
                    <br>
                    <a href="discussions.html" class="discussions-link">
                        ${i18n.t('feedback_question')}
                    </a>
                </div>
            `;
            app.showSheet();
        };
    });
    </script>
    <script>i18n.injectLangToggle('.top-bar');i18n.renderMobileBMC();</script>
    <script src="../webinar-modal.js"></script>
</body>
</html>
