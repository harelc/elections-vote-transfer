    <style>
        html, body { overflow: auto; height: auto; min-height: 100%; }
        .page-content { padding: 52px 0.7rem calc(60px + var(--safe-bottom)); max-width: 560px; margin: 0 auto; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 0.8rem; }
        .card h3 { font-size: 1rem; color: var(--text-primary); margin-bottom: 0.35rem; }
        .note { font-size: 0.78rem; color: var(--text-muted); line-height: 1.45; }
        /* Provenance: simulated vs real, unmissable like the desktop CC */
        .prov { border: 2px solid; border-radius: 12px; padding: 0.7rem 0.9rem; margin-bottom: 0.8rem; display: flex; gap: 0.6rem; align-items: center; }
        .prov.sim { border-color: #ef4444; color: #fecaca; background: repeating-linear-gradient(45deg, rgba(239,68,68,.16) 0 16px, rgba(239,68,68,.07) 16px 32px); }
        .prov.real { border-color: #22c55e; color: #bbf7d0; background: rgba(34,197,94,.1); }
        .prov b { font-size: 0.98rem; }
        .prov .sub { font-size: 0.76rem; opacity: 0.88; line-height: 1.4; }
        /* National turnout */
        .td-big { font-size: 2.1rem; font-weight: 800; color: var(--text-primary); line-height: 1.1; }
        .td-big small { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
        .td-bar-track { height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin: 0.5rem 0 0.35rem; }
        .td-bar-track i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ef4444, #fbbf24 55%, #10b981); transition: width .5s ease; }
        .td-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 0.8rem; margin-top: 0.55rem; }
        .td-stat b { display: block; font-size: 1.05rem; color: var(--text-primary); }
        .td-stat span { font-size: 0.72rem; color: var(--text-muted); }
        /* Snapshot time chips */
        .snap-row { display: flex; gap: 0.35rem; overflow-x: auto; padding: 0.15rem 0 0.35rem; scrollbar-width: none; }
        .snap-row::-webkit-scrollbar { display: none; }
        .snap-chip { flex: none; font-family: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-secondary); border-radius: 999px; padding: 0.32rem 0.7rem; }
        .snap-chip.gold { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
        /* Map */
        #td-map { height: 54vh; min-height: 320px; border-radius: 10px; overflow: hidden; }
        .maplibregl-map { background: var(--bg); }
        .metric-row { display: flex; gap: 0.4rem; margin-bottom: 0.5rem; }
        .metric-btn { flex: 1; font-family: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-secondary); border-radius: 999px; padding: 0.42rem 0.5rem; }
        .metric-btn.gold { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
        .legend { display: flex; align-items: center; gap: 0.45rem; margin-top: 0.5rem; font-size: 0.7rem; color: var(--text-muted); }
        .legend .grad { flex: 1; height: 9px; border-radius: 999px; }
        .maplibregl-popup-content { background: var(--bg-card) !important; color: var(--text-primary) !important; border: 1px solid var(--border); border-radius: 10px !important; font-family: Heebo, sans-serif; font-size: 0.8rem; line-height: 1.5; }
        .maplibregl-popup-tip { border-top-color: var(--bg-card) !important; }
        .maplibregl-popup-close-button { color: var(--text-muted) !important; font-size: 17px !important; }
        /* Group rows */
        .dim-select { width: 100%; font-family: inherit; font-size: 0.85rem; font-weight: 600; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 0.45rem 0.5rem; margin-bottom: 0.55rem; }
        .grow-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 0.25rem 0.6rem; align-items: center; padding: 0.34rem 0; }
        .grow-row + .grow-row { border-top: 1px solid rgba(255,255,255,.05); }
        .grow-label { font-size: 0.82rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .td-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-inline-end: 5px; }
        .grow-nums { font-size: 0.8rem; font-weight: 700; color: var(--text-primary); }
        .grow-nums small { font-weight: 500; color: var(--text-muted); font-size: 0.7rem; }
        .grow-bar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
        .grow-bar i { display: block; height: 100%; border-radius: 999px; }
        /* Settlement lists */
        .set-row { display: flex; justify-content: space-between; gap: 0.6rem; padding: 0.32rem 0; font-size: 0.83rem; }
        .set-row + .set-row { border-top: 1px solid rgba(255,255,255,.05); }
        .set-row .nm { color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .set-row .vl { font-weight: 700; color: var(--text-primary); flex: none; }
        .set-row .vl small { font-weight: 500; color: var(--text-muted); font-size: 0.7rem; }
        .set-sub { font-size: 0.85rem; font-weight: 700; color: var(--accent); margin: 0.55rem 0 0.15rem; }
        .gold-btn { display: block; text-align: center; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 0.92rem; border-radius: 12px; padding: 0.8rem 1rem; text-decoration: none; margin-bottom: 0.8rem; }
        /* Cluster icons + sheet rows: same treatment as m/geomap.html */
        .custom-cluster { background: none !important; border: none !important; }
        .custom-cluster .cluster-inner { width: 100%; height: 100%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: 600; border: 2px solid rgba(255,255,255,0.3); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        .cluster-count { font-size: 0.8rem; line-height: 1; text-shadow: 0 0 4px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.9); }
        .cluster-info { font-size: 0.6rem; opacity: 0.85; line-height: 1; text-shadow: 0 0 4px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.9); }
        .cluster-colocated .cluster-inner { border-style: dashed; border-color: rgba(255,255,255,0.6); }
        .sheet-ballot-row { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: var(--bg-tertiary); cursor: pointer; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-primary); }
        .sheet-ballot-row .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .sheet-ballot-row .pct { margin-inline-start: auto; color: var(--text-muted); font-size: 0.75rem; }
        .sheet-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
        .sheet-sub { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; }
    </style>

    <script>
    (function () {
        'use strict';
        const en = () => i18n.getLang() === 'en';
        const fmt = n => i18n.fmtNum(Math.round(n || 0));
        const F = { cache: 'no-store' };
        // Same fixed colour scales as the desktop command centre
        // (turnout 0% red -> 45% yellow -> 90% green; pace palette 0-1.2).
        const TD_PALETTE = ['#7b2d8b', '#d73027', '#fc8d2e', '#f7d038', '#7fc24a', '#0f9b8e'];
        function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
        function interp(c1, c2, t) {
            const a = hexRgb(c1), b = hexRgb(c2);
            return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
        }
        function multiStop(palette, frac) {
            const f = Math.max(0, Math.min(1, frac)) * (palette.length - 1);
            const i = Math.min(palette.length - 2, Math.floor(f));
            return interp(palette[i], palette[i + 1], f - i);
        }
        function tdColor(v, isPace) {
            if (v == null || !isFinite(v)) return '#374151';
            if (isPace) return multiStop(TD_PALETTE, v / 1.2);
            if (v < 45) return interp('#ef4444', '#fbbf24', Math.max(0, Math.min(1, v / 45)));
            return interp('#fbbf24', '#10b981', Math.max(0, Math.min(1, (v - 45) / 45)));
        }
        const DIMS = [
            ['k25_bloc', 'K25 bloc', 'גוש 25'],
            ['k25_winner', 'K25 winner', 'מנצחת 25'],
            ['stronghold', 'K25 strongholds (≥30%)', 'מעוזי 25 (≥30%)'],
            ['population', 'Population group', 'קבוצת אוכלוסייה'],
            ['form', 'Locality type', 'סוג יישוב'],
            ['district', 'District', 'מחוז'],
            ['socio', 'Socioeconomic cluster', 'אשכול חברתי־כלכלי'],
            ['k25_turnout_band', 'K25 turnout band', 'רצועת הצבעה 25'],
        ];
        let td = null, status = null, snapIdx = null, metric = 'turnout', dim = 'k25_bloc', map = null;

        function snaps() { return (td && td.snapshots) || []; }
        function snap() { const s = snaps(); return s[snapIdx == null ? s.length - 1 : snapIdx] || null; }
        function hhmm(iso) { return (iso || '').slice(11, 16); }

        async function load() {
            const [st, data] = await Promise.all([
                fetch('../data/k26_status.json', F).then(r => r.ok ? r.json() : null).catch(() => null),
                fetch('../data/turnout_day_26.json', F).then(r => r.ok ? r.json() : null).catch(() => null),
            ]);
            status = st || { kind: 'simulated' };
            // Results are out: the count centre takes over.
            if (status.kind === 'partial' || status.kind === 'official') { location.replace('k26.html'); return; }
            td = data;
            render();
            initMap();
        }

        function render() {
            document.getElementById('top-title').textContent = en() ? 'K26 turnout' : 'אחוזי הצבעה 26';
            const real = status && status.kind === 'turnout';
            const prov = document.getElementById('prov');
            prov.className = 'prov ' + (real ? 'real' : 'sim');
            document.getElementById('prov-icon').textContent = real ? '🟢' : '⚠';
            document.getElementById('prov-title').textContent = real
                ? (en() ? 'Real turnout data, as received from the Central Elections Committee' : 'נתוני אמת של שיעורי ההצבעה כפי שהתקבלו מוועדת הבחירות המרכזית')
                : (en() ? 'SIMULATED SCENARIO — not real data' : 'תרחיש מדומה — אלה אינם נתוני אמת');
            document.getElementById('prov-sub').textContent = real
                ? ''
                : (en() ? (td && td.meta.note_en || 'Rehearsal: synthetic turnout, before any real feed.') : (td && td.meta.note_he || 'חזרה: אחוזי הצבעה מדומים, לפני נתוני אמת.'));
            document.getElementById('desktop-link').textContent = en() ? 'Full command centre (desktop) ←' : 'למרכז הבקרה המלא (מחשב) ←';
            renderSnap();
        }

        function renderSnap() {
            const s = snap();
            if (!s) return;
            const row = document.getElementById('snap-row');
            const cur = snapIdx == null ? snaps().length - 1 : snapIdx;
            row.innerHTML = snaps().map((x, i) => `<button class="snap-chip ${i === cur ? 'gold' : ''}" data-snap="${i}">${hhmm(x.as_of)}</button>`).join('');
            row.querySelectorAll('[data-snap]').forEach(b => b.onclick = () => { snapIdx = +b.dataset.snap; renderSnap(); paintMap(); });
            const active = row.querySelector('.gold');
            if (active) active.scrollIntoView({ inline: 'center', block: 'nearest' });

            const n = s.national;
            document.getElementById('nat-title').textContent = en() ? 'National turnout' : 'הצבעה ארצית';
            document.getElementById('nat-turnout').textContent = (n.turnout ?? 0).toFixed(1) + '%';
            document.getElementById('nat-asof').textContent = (en() ? 'as of ' : 'נכון ל־') + hhmm(s.as_of);
            document.getElementById('nat-fill').style.width = Math.min(100, n.turnout || 0) + '%';
            document.getElementById('nat-voters').textContent = fmt(n.voters);
            document.getElementById('nat-pace').textContent = '×' + (n.pace ?? 0).toFixed(2);
            document.getElementById('nat-remaining').textContent = fmt(n.remaining_voters);
            document.getElementById('nat-ballots').textContent = fmt(n.ballots);
            document.getElementById('lbl-voters').textContent = en() ? `voted so far (of ${fmt(n.eligible)} eligible)` : `הצביעו עד כה (מתוך ${fmt(n.eligible)} בעלי זכות)`;
            document.getElementById('lbl-pace').textContent = en() ? 'of K25 final turnout recovered' : 'שוחזרו מההצבעה הסופית ב־25';
            document.getElementById('lbl-remaining').textContent = en() ? 'eligible who have not voted' : 'בעלי זכות שטרם הצביעו';
            document.getElementById('lbl-ballots').textContent = en() ? 'ballot boxes' : 'קלפיות';
            document.getElementById('nat-note').textContent = en()
                ? `K25 final turnout was ${n.k25_turnout}%. "Recovery" (pace) compares voters so far with the K25 twin ballot's final voters.`
                : `בבחירות 25 ההצבעה הסופית הייתה ${n.k25_turnout}%. ״שחזור״ משווה את המצביעים עד כה למצביעים הסופיים בקלפי התאומה מ־25.`;

            document.getElementById('map-title').textContent = en() ? 'Ballot map' : 'מפה לפי קלפי';
            document.getElementById('metric-turnout').textContent = en() ? 'Turnout so far' : 'אחוז הצבעה עד כה';
            document.getElementById('metric-pace').textContent = en() ? 'K25 recovery' : 'שחזור מ־25';
            document.getElementById('metric-turnout').classList.toggle('gold', metric === 'turnout');
            document.getElementById('metric-pace').classList.toggle('gold', metric === 'pace');
            document.getElementById('legend-lo').textContent = metric === 'pace' ? '×0' : '0%';
            document.getElementById('legend-hi').textContent = metric === 'pace' ? '×1.2' : '90%';
            document.getElementById('legend-grad').style.background = metric === 'pace'
                ? `linear-gradient(to left, ${TD_PALETTE.join(', ')})`
                : 'linear-gradient(to left, #ef4444, #fbbf24 50%, #10b981)';
            document.getElementById('map-note').textContent = en() ? 'Tap a dot for that ballot box.' : 'הקשה על נקודה מציגה את הקלפי.';

            renderGroups();
            renderSettlements();
        }

        function renderGroups() {
            document.getElementById('groups-title').textContent = en() ? 'Turnout by group' : 'הצבעה לפי קבוצות';
            const sel = document.getElementById('dim-select');
            sel.innerHTML = DIMS.map(([id, e, h]) => `<option value="${id}" ${id === dim ? 'selected' : ''}>${en() ? e : h}</option>`).join('');
            sel.onchange = () => { dim = sel.value; renderGroups(); };
            const s = snap();
            const byPace = metric === 'pace';
            const rows = ((s && s.groups && s.groups[dim]) || []).slice()
                .sort((a, b) => (byPace ? (b.pace || 0) - (a.pace || 0) : (b.turnout || 0) - (a.turnout || 0)));
            document.getElementById('group-rows').innerHTML = rows.map(r => {
                const v = byPace ? r.pace : r.turnout;
                const col = tdColor(byPace ? r.pace : (r.turnout || 0), byPace);
                const sw = td.party_colors_25 && td.party_colors_25[r.id]
                    ? `<span class="td-swatch" style="background:${td.party_colors_25[r.id]}"></span>` : '';
                return `<div class="grow-row">
                    <span class="grow-label">${sw}${en() ? (r.label_en || r.label_he) : r.label_he}</span>
                    <span class="grow-nums">${byPace ? '×' + (r.pace ?? 0).toFixed(2) : (r.turnout ?? 0).toFixed(1) + '%'} <small>${fmt(r.voters)}</small></span>
                    <span class="grow-bar"><i style="width:${Math.min(100, byPace ? (r.pace || 0) / 1.2 * 100 : (r.turnout || 0))}%;background:${col}"></i></span>
                </div>`;
            }).join('') || `<div class="note">–</div>`;
        }

        function renderSettlements() {
            const s = snap();
            const st = (s && s.settlements) || {};
            document.getElementById('set-title').textContent = en() ? 'Settlements' : 'יישובים';
            document.getElementById('set-high-title').textContent = en() ? 'Highest turnout' : 'ההצבעה הגבוהה ביותר';
            document.getElementById('set-low-title').textContent = en() ? 'Lowest turnout' : 'ההצבעה הנמוכה ביותר';
            document.getElementById('set-rem-title').textContent = en() ? 'Most voters still to come' : 'הכי הרבה מצביעים שעדיין לא הגיעו';
            const row = (x, mode) => `<div class="set-row"><span class="nm">${i18n.settlementName ? i18n.settlementName(x.name) : x.name}</span><span class="vl">${
                mode === 'rem' ? fmt(x.remaining) + ' <small>' + (en() ? 'left' : 'נותרו') + '</small>'
                : (x.turnout ?? 0).toFixed(1) + '% <small>×' + (x.pace ?? 0).toFixed(2) + '</small>'}</span></div>`;
            document.getElementById('set-high').innerHTML = (st.highest_turnout || []).slice(0, 8).map(x => row(x)).join('');
            document.getElementById('set-low').innerHTML = (st.lowest_turnout || []).slice(0, 8).map(x => row(x)).join('');
            document.getElementById('set-rem').innerHTML = (st.most_remaining || []).slice(0, 8).map(x => row(x, 'rem')).join('');
        }

        // Map interaction mirrors m/geomap.html: StationClusterLayer
        // with finger-sized tap targets, cluster zoom, bottom sheets.
        let layer = null;
        function showSheet(html) {
            document.getElementById('sheet-content').innerHTML = html;
            document.getElementById('sheet-backdrop').classList.add('visible');
            document.getElementById('bottom-sheet').classList.add('visible');
        }
        function hideSheet() {
            document.getElementById('sheet-backdrop').classList.remove('visible');
            document.getElementById('bottom-sheet').classList.remove('visible');
        }
        document.getElementById('sheet-backdrop').onclick = hideSheet;
        function stationSheet(d) {
            showSheet(`<div class="sheet-title">${i18n.settlementName ? i18n.settlementName(d.name) : d.name}</div>
                <div class="sheet-sub">${en() ? 'Ballot' : 'קלפי'} ${d.ballot}<br>
                ${en() ? 'Turnout so far' : 'הצבעה עד כה'}: <b>${d.turnout == null ? '–' : d.turnout.toFixed(1) + '%'}</b> (${fmt(d.voters)} / ${fmt(d.eligible)})<br>
                ${en() ? 'K25 recovery' : 'שחזור מ־25'}: <b>${d.pace == null ? '–' : '×' + d.pace.toFixed(2)}</b>
                ${d.winner25 ? `<br>${en() ? 'K25 winner here' : 'ניצחה כאן ב־25'}: ${d.winner25}` : ''}
                ${d.k25Ballot ? `<br>${en() ? 'K25 twin ballot' : 'קלפי תאומה ב־25'}: ${d.k25Ballot}` : ''}</div>`);
        }
        function clusterIcon(items) {
            const count = items.length;
            let wv = 0, we = 0;
            items.forEach(it => { wv += it.station.voters || 0; we += it.station.eligible || 0; });
            const byPace = metric === 'pace';
            // Weighted pace needs the K25-final denominator; approximate
            // with voters-weighted pace of the member ballots.
            let avg = null;
            if (byPace) {
                let sv = 0, sw = 0;
                items.forEach(it => { if (it.station.pace != null) { sv += it.station.pace * (it.station.voters || 0); sw += it.station.voters || 0; } });
                avg = sw ? sv / sw : null;
            } else avg = we ? 100 * wv / we : null;
            const col = tdColor(avg, byPace);
            const info = avg == null ? '' : (byPace ? '×' + avg.toFixed(2) : Math.round(avg) + '%');
            const first = items[0];
            const colocated = items.every(it => Math.abs(it.origLat - first.origLat) < 1e-5 && Math.abs(it.origLng - first.origLng) < 1e-5);
            const size = (count > 500 ? 80 : count > 200 ? 70 : count > 100 ? 60 : count > 30 ? 50 : 40) * (colocated ? 0.85 : 1);
            return {
                html: `<div class="cluster-inner" style="background:${col.replace('rgb', 'rgba').replace(')', ',0.85)')}"><div class="cluster-count">${count}</div><div class="cluster-info">${info}</div></div>`,
                className: 'custom-cluster' + (colocated ? ' cluster-colocated' : ''), size: Math.round(size)
            };
        }
        function mapItems() {
            const s = snap();
            const voters = (s && s.voters) || null;
            const byPace = metric === 'pace';
            const items = [];
            const piles = new Map();
            (td.stations || []).forEach((a, i) => {
                const v = voters ? voters[i] : a[5];
                const k25final = a[8] ? a[5] / a[8] : null;
                const t = a[4] ? 100 * v / a[4] : null;
                const p = k25final ? v / k25final : null;
                const d = { name: a[0], ballot: a[1], turnout: t, pace: p, voters: v, eligible: a[4], winner25: a[9] || '', k25Ballot: a[17] || '' };
                const rec = { lng: a[3], lat: a[2], origLng: a[3], origLat: a[2], color: tdColor(byPace ? p : t, byPace), radius: 5, station: d };
                items.push(rec);
                const key = a[2].toFixed(5) + ',' + a[3].toFixed(5);
                if (!piles.has(key)) piles.set(key, []);
                piles.get(key).push(rec);
            });
            piles.forEach(group => {
                if (group.length < 2) return;
                group.forEach((rec, i) => {
                    const angle = (2 * Math.PI * i) / group.length;
                    rec.lat += Math.sin(angle) * 0.00012;
                    rec.lng += Math.cos(angle) * 0.00012;
                });
            });
            return items;
        }
        function paintMap() {
            if (layer) layer.setStations(mapItems());
        }
        function initMap() {
            if (!td) return;
            map = createMap('td-map', {
                center: [34.9, 31.4], zoom: 7.4, minZoom: 6.5, maxZoom: 16,
                basemap: 'dark_matter', zoomPosition: 'bottom-right'
            });
            layer = new StationClusterLayer(map, {
                clusterHTML: (stations) => clusterIcon(stations),
                onClusterClick: (stations, lng, lat, clusterId) => {
                    const first = stations[0];
                    const colocated = stations.every(it => Math.abs(it.origLat - first.origLat) < 1e-5 && Math.abs(it.origLng - first.origLng) < 1e-5);
                    if (colocated) {
                        showSheet(`<div class="sheet-title">${i18n.settlementName ? i18n.settlementName(first.station.name) : first.station.name}</div>
                            <div class="sheet-sub" style="margin-bottom:8px">${stations.length} ${en() ? 'ballot boxes at this venue — tap one:' : 'קלפיות באותו מקום — הקשה על אחת:'}</div>` +
                            stations.map((it, i) => `<div class="sheet-ballot-row" data-row="${i}"><span class="dot" style="background:${it.color}"></span>${en() ? 'Ballot' : 'קלפי'} ${it.station.ballot}<span class="pct">${it.station.turnout == null ? '–' : it.station.turnout.toFixed(1) + '%'} · ×${it.station.pace == null ? '–' : it.station.pace.toFixed(2)}</span></div>`).join(''));
                        document.querySelectorAll('#sheet-content [data-row]').forEach(row => row.onclick = () => stationSheet(stations[+row.dataset.row].station));
                    } else layer.zoomCluster(clusterId, lng, lat);
                },
                onStationClick: (item) => stationSheet(item.station)
            });
            layer.setStations(mapItems());
            document.getElementById('metric-turnout').onclick = () => { metric = 'turnout'; renderSnap(); paintMap(); };
            document.getElementById('metric-pace').onclick = () => { metric = 'pace'; renderSnap(); paintMap(); };
        }

        document.addEventListener('langchange', () => { render(); });
        load();
        setInterval(load, 90000);
    })();
    </script>
    <script src="../webinar-modal.js"></script>
</body>
</html>
