        .prov.sim { border-color: #ef4444; color: #fecaca; background: repeating-linear-gradient(45deg, rgba(239,68,68,.16) 0 16px, rgba(239,68,68,.07) 16px 32px); }

    <script>
    (function () {
        'use strict';
        const en = () => i18n.getLang() === 'en';
        const fmt = n => i18n.fmtNum(Math.round(n || 0));
        const F = { cache: 'no-store' };
        // Same fixed colour scales as the desktop command centre
        // (turnout 0% red -> 45% yellow -> 90% green; pace palette 0-1.2).
        const TD_PALETTE = ['#7b2d8b', '#d73027', '#fc8d2e', '#f7d038', '#7fc24a', '#0f9b8e'];
        function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
        function interp(c1, c2, t) {
            const a = hexRgb(c1), b = hexRgb(c2);
            return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
        }
        function multiStop(palette, frac) {
            const f = Math.max(0, Math.min(1, frac)) * (palette.length - 1);
            const i = Math.min(palette.length - 2, Math.floor(f));
            return interp(palette[i], palette[i + 1], f - i);
        }
        // Fixed scale (same values all day) vs adaptive (palette
        // stretched over the current snapshot's p5-p95 band) — same
        // choice the desktop command centre offers.
        let scaleMode = 'fixed';
        const scaleBandCache = {};
        function adaptiveBand(isPace) {
            const s = snap();
            const key = (isPace ? 'p' : 't') + ':' + (s ? s.as_of : '');
            if (scaleBandCache[key]) return scaleBandCache[key];
            const voters = (s && s.voters) || null;
            const values = (td.stations || []).map((a, i) => {
                const v = voters ? voters[i] : a[5];
                if (v == null || !a[4]) return null;
                return isPace ? (a[8] ? v / (a[5] / a[8]) : null) : 100 * v / a[4];
            }).filter(v => v != null && isFinite(v)).sort((a, b) => a - b);
            if (!values.length) return null;
            let lo = values[Math.floor(values.length * 0.05)];
            let hi = values[Math.min(values.length - 1, Math.floor(values.length * 0.95))];
            const minSpan = isPace ? 0.12 : 8;
            if (hi - lo < minSpan) { const mid = (lo + hi) / 2; lo = mid - minSpan / 2; hi = mid + minSpan / 2; }
            return scaleBandCache[key] = { lo, hi };
        }
        function tdColor(v, isPace) {
            if (v == null || !isFinite(v)) return '#374151';
            if (scaleMode === 'adaptive') {
                const band = adaptiveBand(isPace);
                if (band) return multiStop(TD_PALETTE, (v - band.lo) / (band.hi - band.lo));
            }
            if (isPace) return multiStop(TD_PALETTE, v / 1.2);
            if (v < 45) return interp('#ef4444', '#fbbf24', Math.max(0, Math.min(1, v / 45)));
            return interp('#fbbf24', '#10b981', Math.max(0, Math.min(1, (v - 45) / 45)));
        }
        const DIMS = [
            ['k25_bloc', 'K25 bloc', 'גוש 25'],
            ['k25_winner', 'K25 winner', 'מנצחת 25'],
            ['stronghold', 'K25 strongholds (≥30%)', 'מעוזי 25 (≥30%)'],
            ['population', 'Population group', 'קבוצת אוכלוסייה'],
            ['form', 'Locality type', 'סוג יישוב'],
            ['district', 'District', 'מחוז'],
            ['socio', 'Socioeconomic cluster', 'אשכול חברתי־כלכלי'],
            ['k25_turnout_band', 'K25 turnout band', 'רצועת הצבעה 25'],
        ];
        let td = null, status = null, snapIdx = null, metric = 'turnout', dim = 'k25_bloc', map = null, hist = null;

        function snaps() { return (td && td.snapshots) || []; }
        function snap() { const s = snaps(); return s[snapIdx == null ? s.length - 1 : snapIdx] || null; }
        // National-only snapshots (CEC headline figures) carry no
        // groups/settlements — fall back to the last detailed one.
        function detailSnap() { const s = snap(); return (s && s.groups) ? s : ([...snaps()].reverse().find(x => x.groups) || s); }
        function hhmm(iso) { return (iso || '').slice(11, 16); }

        async function load() {
            const [st, data, histData] = await Promise.all([
                fetch('../data/k26_status.json', F).then(r => r.ok ? r.json() : null).catch(() => null),
                fetch('../data/turnout_day_26.json', F).then(r => r.ok ? r.json() : null).catch(() => null),
                fetch('../data/historical_turnout.json', F).then(r => r.ok ? r.json() : null).catch(() => null),
            ]);
            hist = histData;
            status = st || { kind: 'simulated' };
            // Results are out: the count centre takes over.
            if (status.kind === 'partial' || status.kind === 'official') { location.replace('k26.html'); return; }
            td = data;
            render();
            initMap();
        }

        function render() {
            document.getElementById('top-title').textContent = en() ? 'K26 turnout' : 'אחוזי הצבעה 26';
            const real = status && status.kind === 'turnout';
            const prov = document.getElementById('prov');
            prov.className = 'prov ' + (real ? 'real' : 'sim');
            document.getElementById('prov-icon').textContent = real ? '🟢' : '⚠';
            document.getElementById('prov-title').textContent = real
                ? (en() ? 'Real turnout data, as received from the Central Elections Committee' : 'נתוני אמת של שיעורי ההצבעה כפי שהתקבלו מוועדת הבחירות המרכזית')
                : (en() ? 'SIMULATED SCENARIO — not real data' : 'תרחיש מדומה — אלה אינם נתוני אמת');
            document.getElementById('prov-sub').textContent = real
                ? ''
                : (en() ? (td && td.meta.note_en || 'Rehearsal: synthetic turnout, before any real feed.') : (td && td.meta.note_he || 'חזרה: אחוזי הצבעה מדומים, לפני נתוני אמת.'));
            document.getElementById('desktop-link').textContent = en() ? 'Full command centre (desktop) ←' : 'למרכז הבקרה המלא (מחשב) ←';
            renderSnap();
        }

        function renderSnap() {
            const s = snap();
            if (!s) return;
            const row = document.getElementById('snap-row');
            const cur = snapIdx == null ? snaps().length - 1 : snapIdx;
            row.innerHTML = snaps().map((x, i) => `<button class="snap-chip ${i === cur ? 'gold' : ''}" data-snap="${i}">${hhmm(x.as_of)}</button>`).join('');
            row.querySelectorAll('[data-snap]').forEach(b => b.onclick = () => { snapIdx = +b.dataset.snap; renderSnap(); paintMap(); });
            const active = row.querySelector('.gold');
            // Centre the chip horizontally WITHOUT scrollIntoView —
            // that also scrolls the page vertically back to the top
            // whenever renderSnap() runs (e.g. colour-scale toggle).
            if (active) {
                const rr = row.getBoundingClientRect(), ar = active.getBoundingClientRect();
                row.scrollLeft += (ar.left + ar.width / 2) - (rr.left + rr.width / 2);
            }

            const n = s.national;
            const natOnly = document.getElementById('nat-only-note');
            natOnly.hidden = !s.national_only;
            natOnly.textContent = en() ? 'Only national figures have been published so far — the per-ballot breakdown will update when the CEC feed opens.' : 'פורסמו רק נתונים ארציים — הפילוח לפי קלפיות יתעדכן עם פתיחת הזנת ועדת הבחירות.';
            document.getElementById('nat-title').textContent = en() ? 'National turnout' : 'הצבעה ארצית';
            document.getElementById('nat-turnout').textContent = (n.turnout ?? 0).toFixed(1) + '%';
            document.getElementById('nat-asof').textContent = (en() ? 'as of ' : 'נכון ל־') + hhmm(s.as_of);
            document.getElementById('nat-fill').style.width = Math.min(100, n.turnout || 0) + '%';
            document.getElementById('nat-voters').textContent = fmt(n.voters);
            document.getElementById('nat-pace').textContent = '×' + (n.pace ?? 0).toFixed(2);
            document.getElementById('nat-remaining').textContent = fmt(n.remaining_voters);
            document.getElementById('nat-ballots').textContent = fmt(n.ballots);
            document.getElementById('lbl-voters').textContent = en() ? `voted so far (of ${fmt(n.eligible)} eligible)` : `הצביעו עד כה (מתוך ${fmt(n.eligible)} בעלי זכות)`;
            document.getElementById('lbl-pace').textContent = en() ? 'of K25 final turnout recovered' : 'שוחזרו מההצבעה הסופית ב־25';
            document.getElementById('lbl-remaining').textContent = en() ? 'eligible who have not voted' : 'בעלי זכות שטרם הצביעו';
            document.getElementById('lbl-ballots').textContent = en() ? 'ballot boxes' : 'קלפיות';
            document.getElementById('nat-note').textContent = en()
                ? `K25 final turnout was ${n.k25_turnout}%. "Recovery" (pace) compares voters so far with the K25 twin ballot's final voters.`
                : `בבחירות 25 ההצבעה הסופית הייתה ${n.k25_turnout}%. ״שחזור״ משווה את המצביעים עד כה למצביעים הסופיים בקלפי התאומה מ־25.`;

            document.getElementById('map-title').textContent = en() ? 'Ballot map' : 'מפה לפי קלפי';
            document.getElementById('metric-turnout').textContent = en() ? 'Turnout so far' : 'אחוז הצבעה עד כה';
            document.getElementById('metric-pace').textContent = en() ? 'K25 recovery' : 'שחזור מ־25';
            document.getElementById('metric-turnout').classList.toggle('gold', metric === 'turnout');
            document.getElementById('metric-pace').classList.toggle('gold', metric === 'pace');
            updateMetricUI();
            document.getElementById('map-note').textContent = en() ? 'Tap a dot for that ballot box.' : 'הקשה על נקודה מציגה את הקלפי.';

            renderGroups();
            renderSettlements();
            renderHist();
            renderDist();
        }

        // Metric/scale toggle wiring + legend. Kept separate from
        // renderSnap(): the toggles must NOT re-render the page —
        // rebuilding the cards above the map makes some mobile
        // browsers lose scroll anchoring and jump to the top.
        function updateMetricUI() {
            document.getElementById('metric-turnout').classList.toggle('gold', metric === 'turnout');
            document.getElementById('metric-pace').classList.toggle('gold', metric === 'pace');
            const fxB = document.getElementById('scale-fixed'), adB = document.getElementById('scale-adaptive');
            fxB.textContent = en() ? 'Fixed scale' : 'סולם קבוע';
            adB.textContent = en() ? 'Adaptive scale' : 'סולם מותאם';
            fxB.classList.toggle('gold', scaleMode === 'fixed');
            adB.classList.toggle('gold', scaleMode === 'adaptive');
            const keepScroll = fn => () => {
                const y = window.scrollY;
                fn();
                requestAnimationFrame(() => { if (window.scrollY !== y) window.scrollTo(0, y); });
            };
            fxB.onclick = keepScroll(() => { if (scaleMode !== 'fixed') { scaleMode = 'fixed'; updateMetricUI(); paintMap(); renderGroups(); } });
            adB.onclick = keepScroll(() => { if (scaleMode !== 'adaptive') { scaleMode = 'adaptive'; updateMetricUI(); paintMap(); renderGroups(); } });
            const band = scaleMode === 'adaptive' ? adaptiveBand(metric === 'pace') : null;
            document.getElementById('legend-lo').textContent = band
                ? (metric === 'pace' ? '×' + band.lo.toFixed(2) : Math.round(band.lo) + '%')
                : (metric === 'pace' ? '×0' : '0%');
            document.getElementById('legend-hi').textContent = band
                ? (metric === 'pace' ? '×' + band.hi.toFixed(2) : Math.round(band.hi) + '%')
                : (metric === 'pace' ? '×1.2' : '90%');
            document.getElementById('legend-grad').style.background = (metric === 'pace' || scaleMode === 'adaptive')
                ? `linear-gradient(to left, ${TD_PALETTE.join(', ')})`
                : 'linear-gradient(to left, #ef4444, #fbbf24 50%, #10b981)';
        }

        // Per-ballot turnout histogram + why it trails the national
        // headline (the CEC feed's two layers are different vintages).
        function renderDist() {
            const card = document.getElementById('dist-card');
            if (!td) { card.hidden = true; return; }
            const s = snap();
            const voters = (s && s.voters) || null;
            const natT = (s && s.national || {}).turnout;
            const vals = [];
            let wSum = 0, wElig = 0;
            (td.stations || []).forEach((a, i) => {
                const v = voters ? voters[i] : a[5];
                if (v == null || !a[4]) return;
                vals.push(100 * v / a[4]); wSum += v; wElig += a[4];
            });
            if (vals.length < 50) { card.hidden = true; return; }
            vals.sort((a, b) => a - b);
            const q = p => vals[Math.min(vals.length - 1, Math.floor(vals.length * p))];
            const mean = vals.reduce((x, v) => x + v, 0) / vals.length;
            const wMean = wElig ? 100 * wSum / wElig : null;
            const above = natT != null ? vals.filter(v => v > natT).length : 0;
            const BIN = 2, MAXB = 40, bins = new Array(MAXB / BIN).fill(0);
            vals.forEach(v => { bins[Math.min(bins.length - 1, Math.floor(v / BIN))]++; });
            const maxBin = Math.max(...bins);
            const W = 720, H = 250, L = 46, R = 706, T = 16, B = 206;
            const X = v => L + v / MAXB * (R - L), Y = c => B - c / maxBin * (B - T);
            let g = '';
            bins.forEach((c, i) => { const h = B - Y(c); if (h > 0) g += `<rect x="${(X(i * BIN) + 1).toFixed(1)}" y="${Y(c).toFixed(1)}" width="${(X(BIN) - X(0) - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="rgba(150,170,205,.55)"/>`; });
            [0, 10, 20, 30, 40].forEach(v => { g += `<text x="${X(v)}" y="${B + 17}" fill="#8b93a5" font-size="11" text-anchor="middle">${v}%</text>`; });
            if (natT != null && natT <= MAXB) {
                g += `<line x1="${X(natT)}" y1="${T - 4}" x2="${X(natT)}" y2="${B}" stroke="#f0b429" stroke-width="3"/>`;
                g += `<text x="${Math.min(X(natT) + 7, R - 140)}" y="${T + 9}" fill="#ffd75e" font-size="14" font-weight="700">${en() ? 'National' : 'ארצי'} ${natT.toFixed(1)}%</text>`;
            }
            const med = q(0.5);
            g += `<line x1="${X(med)}" y1="${T - 4}" x2="${X(med)}" y2="${B}" stroke="#dbe4ee" stroke-width="1.5" stroke-dasharray="4 3"/>`;
            document.getElementById('dist-title').textContent = en() ? 'Turnout spread across ballot boxes' : 'התפלגות שיעורי ההצבעה בין הקלפיות';
            document.getElementById('dist-chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;direction:ltr">${g}</svg>`;
            const f1 = v => v == null ? '–' : v.toFixed(1) + '%';
            document.getElementById('dist-stats').innerHTML = en()
                ? `Median ballot <b>${f1(med)}</b> · mean <b>${f1(mean)}</b> · weighted mean <b>${f1(wMean)}</b> · middle 50%: ${f1(q(0.25))}–${f1(q(0.75))} · only <b>${above.toLocaleString()} (${(100 * above / vals.length).toFixed(1)}%)</b> of ballots are above the national figure.`
                : `קלפי חציונית <b>${f1(med)}</b> · ממוצע <b>${f1(mean)}</b> · ממוצע משוקלל <b>${f1(wMean)}</b> · 50% האמצעיים: ${f1(q(0.25))}–${f1(q(0.75))} · רק <b>${above.toLocaleString()} (${(100 * above / vals.length).toFixed(1)}%)</b> מהקלפיות מעל הנתון הארצי.`;
            const lag = (natT != null && wMean != null) ? natT - wMean : null;
            const bv = (s && s.national || {}).ballot_vintage;
            document.getElementById('dist-note').textContent = (en()
                ? `Why the map trails the headline: the CEC feed's national total (${natT != null ? natT.toFixed(1) : '–'}%) is the official hourly release, while its per-ballot layer is an earlier vintage (weighted mean ${f1(wMean)}, a ${lag != null ? lag.toFixed(1) : '–'}-point gap). The national figure rules for the country; the ballot layer catches up in later exports.`
                : `למה המפה מפגרת אחרי הכותרת: הנתון הארצי בהזנת ועדת הבחירות (${natT != null ? natT.toFixed(1) : '–'}%) הוא הפרסום השעתי הרשמי, ואילו שכבת הקלפיות היא מגרסה מוקדמת יותר (ממוצע משוקלל ${f1(wMean)}, פער של ${lag != null ? lag.toFixed(1) : '–'} נקודות). הנתון הארצי קובע לגבי המדינה; שכבת הקלפיות מתעדכנת בייצואים הבאים.`)
                + (bv ? (en() ? ` Half the ballots were last updated by ${bv.median_updated}; only ${bv.share_at_data_hour}% at the data hour itself.` : ` חצי מהקלפיות עודכנו לאחרונה עד ${bv.median_updated}; רק ${bv.share_at_data_hour}% עודכנו בשעת הנתון עצמה.`) : '');
            card.hidden = false;
        }

        // Today (gold) vs every past election's hourly turnout curve
        // (K8–K25; data/historical_turnout.json, credited below).
        function histAtHour(values, hours, t) {
            if (t <= hours[0]) return values[0];
            for (let i = 1; i < hours.length; i++) {
                if (t <= hours[i]) { const f = (t - hours[i - 1]) / (hours[i] - hours[i - 1]); return values[i - 1] + f * (values[i] - values[i - 1]); }
            }
            return values[values.length - 1];
        }
        function renderHist() {
            const card = document.getElementById('hist-card');
            if (!hist || !td) { card.hidden = true; return; }
            const hours = hist.hours, els = hist.elections || [];
            const today = snaps().map(s => {
                const hm = hhmm(s.as_of).split(':'); return { t: (+hm[0]) + (+hm[1]) / 60, v: (s.national || {}).turnout };
            }).filter(p => p.v != null && p.t >= 10);
            const W = 720, H = 330, L = 52, R = 700, T = 16, B = 288;
            const X = t => L + (t - 10) / 12 * (R - L), Y = v => T + (85 - v) / 85 * (B - T);
            const path = pts => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
            let g = '';
            [0, 25, 50, 75].forEach(v => { g += `<line x1="${L}" y1="${Y(v)}" x2="${R}" y2="${Y(v)}" stroke="rgba(255,255,255,.08)"/><text x="${L - 6}" y="${Y(v) + 5}" fill="#aeb8cc" font-size="15" text-anchor="end">${v}%</text>`; });
            hours.forEach(h => { g += `<text x="${X(h)}" y="${B + 22}" fill="#aeb8cc" font-size="15" text-anchor="middle">${String(h).padStart(2, '0')}:00</text>`; });
            const env = hours.map((h, i) => [Math.min(...els.map(e => e.values[i])), Math.max(...els.map(e => e.values[i]))]);
            g += `<path d="${path(env.map((e, i) => [X(hours[i]), Y(e[1])]))} ${env.map((e, i) => [X(hours[hours.length - 1 - i]), Y(env[hours.length - 1 - i][0])]).map(p => `L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} Z" fill="rgba(160,175,200,.13)"/>`;
            const k25 = els.find(e => e.knesset === 25);
            if (k25) {
                g += `<path d="${path(k25.values.map((v, i) => [X(hours[i]), Y(v)]))}" fill="none" stroke="#dbe4ee" stroke-width="3.5"/>`;
                const kv = k25.values[k25.values.length - 1];
                g += `<text x="${R - 4}" y="${Y(kv) - 10}" fill="#dbe4ee" font-size="17" font-weight="700" text-anchor="end">${en() ? 'K25' : 'כנסת 25'} ${kv.toFixed(1)}%</text>`;
            }
            if (today.length) {
                g += `<path d="${path(today.map(p => [X(p.t), Y(p.v)]))}" fill="none" stroke="#f0b429" stroke-width="5" stroke-linejoin="round"/>`;
                today.forEach(p => { g += `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="5.5" fill="#f0b429" stroke="#0b0e14" stroke-width="1.5"/>`; });
                const last = today[today.length - 1];
                g += `<text x="${Math.min(X(last.t) + 10, R - 110)}" y="${Math.max(Y(last.v) - 12, 18)}" fill="#ffd75e" font-size="19" font-weight="800">${en() ? 'Today' : 'היום'} ${last.v.toFixed(1)}%</text>`;
            }
            document.getElementById('hist-title').textContent = en() ? 'Today vs history: turnout by hour' : 'היום מול ההיסטוריה: הצבעה לפי שעה';
            document.getElementById('hist-chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;direction:ltr">${g}</svg>`;
            const last = today[today.length - 1];
            let note = '';
            if (last && last.t >= 10 && els.length) {
                const at = els.map(e => histAtHour(e.values, hours, last.t)).sort((a, b) => a - b);
                const med = at[Math.floor(at.length / 2)], k25v = k25 ? histAtHour(k25.values, hours, last.t) : null;
                const higher = at.filter(v => v > last.v).length;
                note = en() ? `At this hour in past elections: median ${med.toFixed(1)}%${k25v != null ? `, K25 ${k25v.toFixed(1)}% (today ${last.v >= k25v ? '+' : ''}${(last.v - k25v).toFixed(1)} pts)` : ''}. Only ${higher} of ${at.length} past elections were higher.`
                    : `בשעה זו בבחירות קודמות: חציון ${med.toFixed(1)}%${k25v != null ? `, כנסת 25: ${k25v.toFixed(1)}% (היום ${last.v >= k25v ? '+' : ''}${(last.v - k25v).toFixed(1)} נק׳)` : ''}. רק ${higher} מתוך ${at.length} הבחירות הקודמות היו גבוהות יותר.`;
            } else if (k25) {
                note = en() ? `Hourly history starts at 10:00 — K25 stood at ${k25.values[0].toFixed(1)}% then.` : `ההיסטוריה השעתית מתחילה ב־10:00 — בכנסת 25 עמדה אז על ${k25.values[0].toFixed(1)}%.`;
            }
            document.getElementById('hist-note').innerHTML = `${note} <span style="color:#dbe4ee">— ${en() ? 'K25 (2022)' : 'כנסת 25 (2022)'}</span> · <span style="color:#ffd75e">${en() ? 'gold: today' : 'זהב: היום'}</span>`;
            document.getElementById('hist-src').textContent = en() ? hist.source_en : hist.source_he;
            card.hidden = false;
        }

        function renderGroups() {
            document.getElementById('groups-title').textContent = en() ? 'Turnout by group' : 'הצבעה לפי קבוצות';
            const sel = document.getElementById('dim-select');
            sel.innerHTML = DIMS.map(([id, e, h]) => `<option value="${id}" ${id === dim ? 'selected' : ''}>${en() ? e : h}</option>`).join('');
            sel.onchange = () => { dim = sel.value; renderGroups(); };
            const s = detailSnap();
            const byPace = metric === 'pace';
            const rows = ((s && s.groups && s.groups[dim]) || []).slice()
                .sort((a, b) => (byPace ? (b.pace || 0) - (a.pace || 0) : (b.turnout || 0) - (a.turnout || 0)));
            document.getElementById('group-rows').innerHTML = rows.map(r => {
                const v = byPace ? r.pace : r.turnout;
                const col = tdColor(byPace ? r.pace : (r.turnout || 0), byPace);
                const sw = td.party_colors_25 && td.party_colors_25[r.id]
                    ? `<span class="td-swatch" style="background:${td.party_colors_25[r.id]}"></span>` : '';
                return `<div class="grow-row">
                    <span class="grow-label">${sw}${en() ? (r.label_en || r.label_he) : r.label_he}</span>
                    <span class="grow-nums">${byPace ? '×' + (r.pace ?? 0).toFixed(2) : (r.turnout ?? 0).toFixed(1) + '%'} <small>${fmt(r.voters)}</small></span>
                    <span class="grow-bar"><i style="width:${Math.min(100, byPace ? (r.pace || 0) / 1.2 * 100 : (r.turnout || 0))}%;background:${col}"></i></span>
                </div>`;
            }).join('') || `<div class="note">–</div>`;
        }

        function renderSettlements() {
            const s = detailSnap();
            const st = (s && s.settlements) || {};
            document.getElementById('set-title').textContent = en() ? 'Settlements' : 'יישובים';
            document.getElementById('set-high-title').textContent = en() ? 'Highest turnout' : 'ההצבעה הגבוהה ביותר';
            document.getElementById('set-low-title').textContent = en() ? 'Lowest turnout' : 'ההצבעה הנמוכה ביותר';
            document.getElementById('set-rem-title').textContent = en() ? 'Most voters still to come' : 'הכי הרבה מצביעים שעדיין לא הגיעו';
            const row = (x, mode) => `<div class="set-row"><span class="nm">${i18n.settlementName ? i18n.settlementName(x.name) : x.name}</span><span class="vl">${
                mode === 'rem' ? fmt(x.remaining) + ' <small>' + (en() ? 'left' : 'נותרו') + '</small>'
                : (x.turnout ?? 0).toFixed(1) + '% <small>×' + (x.pace ?? 0).toFixed(2) + '</small>'}</span></div>`;
            document.getElementById('set-high').innerHTML = (st.highest_turnout || []).slice(0, 8).map(x => row(x)).join('');
            document.getElementById('set-low').innerHTML = (st.lowest_turnout || []).slice(0, 8).map(x => row(x)).join('');
            document.getElementById('set-rem').innerHTML = (st.most_remaining || []).slice(0, 8).map(x => row(x, 'rem')).join('');
        }

        // Map interaction mirrors m/geomap.html: StationClusterLayer
        // with finger-sized tap targets, cluster zoom, bottom sheets.
        let layer = null;
        function showSheet(html) {
            document.getElementById('sheet-content').innerHTML = html;
            document.getElementById('sheet-backdrop').classList.add('visible');
            document.getElementById('bottom-sheet').classList.add('visible');
        }
        function hideSheet() {
            document.getElementById('sheet-backdrop').classList.remove('visible');
            document.getElementById('bottom-sheet').classList.remove('visible');
        }
        document.getElementById('sheet-backdrop').onclick = hideSheet;
        function stationSheet(d) {
            showSheet(`<div class="sheet-title">${i18n.settlementName ? i18n.settlementName(d.name) : d.name}</div>
                <div class="sheet-sub">${en() ? 'Ballot' : 'קלפי'} ${d.ballot}<br>
                ${en() ? 'Turnout so far' : 'הצבעה עד כה'}: <b>${d.turnout == null ? '–' : d.turnout.toFixed(1) + '%'}</b> (${fmt(d.voters)} / ${fmt(d.eligible)})<br>
                ${en() ? 'K25 recovery' : 'שחזור מ־25'}: <b>${d.pace == null ? '–' : '×' + d.pace.toFixed(2)}</b>
                ${d.winner25 ? `<br>${en() ? 'K25 winner here' : 'ניצחה כאן ב־25'}: ${d.winner25}` : ''}
                ${d.k25Ballot ? `<br>${en() ? 'K25 twin ballot' : 'קלפי תאומה ב־25'}: ${d.k25Ballot}` : ''}</div>`);
        }
        function clusterIcon(items) {
            const count = items.length;
            let wv = 0, we = 0;
            items.forEach(it => { if (it.station.voters == null) return; wv += it.station.voters; we += it.station.eligible || 0; });
            const byPace = metric === 'pace';
            // Weighted pace needs the K25-final denominator; approximate
            // with voters-weighted pace of the member ballots.
            let avg = null;
            if (byPace) {
                let sv = 0, sw = 0;
                items.forEach(it => { if (it.station.pace != null) { sv += it.station.pace * (it.station.voters || 0); sw += it.station.voters || 0; } });
                avg = sw ? sv / sw : null;
            } else avg = we ? 100 * wv / we : null;
            const col = tdColor(avg, byPace);
            const info = avg == null ? '' : (byPace ? '×' + avg.toFixed(2) : Math.round(avg) + '%');
            const first = items[0];
            const colocated = items.every(it => Math.abs(it.origLat - first.origLat) < 1e-5 && Math.abs(it.origLng - first.origLng) < 1e-5);
            const size = (count > 500 ? 80 : count > 200 ? 70 : count > 100 ? 60 : count > 30 ? 50 : 40) * (colocated ? 0.85 : 1);
            return {
                html: `<div class="cluster-inner" style="background:${col.replace('rgb', 'rgba').replace(')', ',0.85)')}"><div class="cluster-count">${count}</div><div class="cluster-info">${info}</div></div>`,
                className: 'custom-cluster' + (colocated ? ' cluster-colocated' : ''), size: Math.round(size)
            };
        }
        function mapItems() {
            const s = snap();
            const voters = (s && s.voters) || null;
            const byPace = metric === 'pace';
            const items = [];
            const piles = new Map();
            (td.stations || []).forEach((a, i) => {
                const v = voters ? voters[i] : a[5];
                const k25final = a[8] ? a[5] / a[8] : null;
                const t = (v == null || !a[4]) ? null : 100 * v / a[4];
                const p = (v == null || !k25final) ? null : v / k25final;
                const d = { name: a[0], ballot: a[1], turnout: t, pace: p, voters: v, eligible: a[4], winner25: a[9] || '', k25Ballot: a[17] || '' };
                const rec = { lng: a[3], lat: a[2], origLng: a[3], origLat: a[2], color: tdColor(byPace ? p : t, byPace), radius: 5, station: d };
                items.push(rec);
                const key = a[2].toFixed(5) + ',' + a[3].toFixed(5);
                if (!piles.has(key)) piles.set(key, []);
                piles.get(key).push(rec);
            });
            piles.forEach(group => {
                if (group.length < 2) return;
                group.forEach((rec, i) => {
                    const angle = (2 * Math.PI * i) / group.length;
                    rec.lat += Math.sin(angle) * 0.00012;
                    rec.lng += Math.cos(angle) * 0.00012;
                });
            });
            return items;
        }
        function paintMap() {
            if (layer) layer.setStations(mapItems());
        }
        function initMap() {
            if (!td) return;
            map = createMap('td-map', {
                center: [34.9, 31.4], zoom: 7.4, minZoom: 6.5, maxZoom: 16,
                basemap: 'dark_matter', zoomPosition: 'bottom-right'
            });
            layer = new StationClusterLayer(map, {
                clusterHTML: (stations) => clusterIcon(stations),
                onClusterClick: (stations, lng, lat, clusterId) => {
                    const first = stations[0];
                    const colocated = stations.every(it => Math.abs(it.origLat - first.origLat) < 1e-5 && Math.abs(it.origLng - first.origLng) < 1e-5);
                    if (colocated) {
                        showSheet(`<div class="sheet-title">${i18n.settlementName ? i18n.settlementName(first.station.name) : first.station.name}</div>
                            <div class="sheet-sub" style="margin-bottom:8px">${stations.length} ${en() ? 'ballot boxes at this venue — tap one:' : 'קלפיות באותו מקום — הקשה על אחת:'}</div>` +
                            stations.map((it, i) => `<div class="sheet-ballot-row" data-row="${i}"><span class="dot" style="background:${it.color}"></span>${en() ? 'Ballot' : 'קלפי'} ${it.station.ballot}<span class="pct">${it.station.turnout == null ? '–' : it.station.turnout.toFixed(1) + '%'} · ×${it.station.pace == null ? '–' : it.station.pace.toFixed(2)}</span></div>`).join(''));
                        document.querySelectorAll('#sheet-content [data-row]').forEach(row => row.onclick = () => stationSheet(stations[+row.dataset.row].station));
                    } else layer.zoomCluster(clusterId, lng, lat);
                },
                onStationClick: (item) => stationSheet(item.station)
            });
            layer.setStations(mapItems());
            const keepScroll = fn => () => {
                const y = window.scrollY;
                fn();
                requestAnimationFrame(() => { if (window.scrollY !== y) window.scrollTo(0, y); });
            };
            document.getElementById('metric-turnout').onclick = keepScroll(() => { metric = 'turnout'; updateMetricUI(); paintMap(); renderGroups(); });
            document.getElementById('metric-pace').onclick = keepScroll(() => { metric = 'pace'; updateMetricUI(); paintMap(); renderGroups(); });
        }

        document.addEventListener('langchange', () => { render(); });
        load();
        setInterval(load, 90000);
    })();
    </script>
    <script src="../webinar-modal.js"></script>
</body>
