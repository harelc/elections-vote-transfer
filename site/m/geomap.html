<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:type" content="website">
    <meta property="og:title" content="קולות נודדים — מפה גיאוגרפית">
    <meta property="og:description" content="ניתוח אינטראקטיבי של נתוני בחירות לכנסת — Interactive Israeli Knesset election data analysis">
    <meta property="og:image" content="https://kolot-nodedim.netlify.app/og-image.png?v=2">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:image" content="https://kolot-nodedim.netlify.app/og-image.png?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../i18n.css">
    <script src="../i18n.js"></script>
    <script src="../deeplink.js"></script>
    <style>
        #map {
            width: 100%;
            height: 100%;
        }

        .maplibregl-map { background: var(--bg); }

        /* Cluster icons */
        .custom-cluster {
            background: none !important;
            border: none !important;
        }
        .custom-cluster .cluster-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .cluster-count { font-size: 0.8rem; line-height: 1; text-shadow: 0 0 4px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.9); }
        .cluster-info { font-size: 0.6rem; opacity: 0.8; line-height: 1; text-shadow: 0 0 4px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.9); }

        /* Colocated cluster: all ballots at same venue */
        .cluster-colocated .cluster-inner {
            border-style: dashed;
            border-width: 2.5px;
            border-color: rgba(255,255,255,0.6);
        }

        /* Color mode FABs */
        .color-fabs {
            position: fixed;
            top: 52px;
            left: 8px;
            z-index: 400;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .color-fab-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-fab {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .color-fab.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
        .color-fab:active { transform: scale(0.9); }

        .color-fab-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            background: rgba(10, 10, 15, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            transition: opacity 0.15s;
        }

        .color-fab-wrapper.active .color-fab-label {
            color: var(--text-primary);
        }

        /* Search FAB */
        .search-fab {
            top: 52px;
            right: 8px;
        }

        /* Search panel */
        .search-panel {
            position: fixed;
            top: 44px;
            right: 0;
            width: 280px;
            max-height: calc(100% - 100px);
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            border-radius: 0 0 0 var(--radius);
            padding: 12px;
            z-index: 450;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.25s ease;
        }

        .search-panel.visible { transform: translateX(0); }

        .search-panel .search-section { margin-bottom: 12px; }
        .search-panel .section-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .selected-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        /* Station popup override for dark theme */
        .maplibregl-popup-content-wrapper, .maplibregl-popup-content {
            background: var(--bg-card) !important;
            color: var(--text-primary) !important;
            border-radius: var(--radius) !important;
            border: 1px solid var(--border) !important;
            box-shadow: var(--shadow) !important;
        }
        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--bg-card) !important; }
        .maplibregl-popup-close-button { color: var(--text-muted) !important; font-size: 18px !important; }

        .popup-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
        .popup-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
        .popup-parties { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }

        /* Color scale legend */
        .color-scale {
            position: fixed;
            bottom: calc(54px + var(--safe-bottom));
            left: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 10px;
            z-index: 400;
            font-size: 0.7rem;
            min-width: 120px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }
        .color-scale-title { color: var(--text-muted); margin-bottom: 4px; }
        .color-scale-bar {
            height: 8px;
            border-radius: 4px;
            margin-bottom: 2px;
        }
        .color-scale-labels {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.65rem;
            direction: ltr;
        }
        .color-scale-toggle {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 0.65rem;
            cursor: pointer;
        }
        .color-scale-toggle.hidden { display: none; }
        .cluster-legend {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
            display: none;
        }
        .cluster-legend.visible { display: block; }
        .cluster-legend-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 3px;
            font-size: 0.62rem;
            color: var(--text-secondary);
        }
        .cluster-legend-row:last-child { margin-bottom: 0; }
        .cluster-legend-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 3px rgba(0,0,0,0.8);
        }
        .cluster-legend-explain {
            font-size: 0.58rem;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.3;
            font-style: italic;
        }

        /* Compare pills */
        .compare-row {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }
        .compare-row-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        .compare-pills {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }
        .compare-pill {
            padding: 2px 6px;
            font-size: 0.62rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
        }
        .compare-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #1a1408;
        }
        .compare-pill:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            color: var(--text-muted);
        }
        .compare-msg {
            font-size: 0.6rem;
            color: #ef4444;
            margin-top: 3px;
        }
        .color-scale.compare { max-width: min(280px, 72vw); }
        .compare-group-actions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
        .compare-group-btn {
            padding: 3px 8px;
            font-size: 0.62rem;
            border-radius: 4px;
            border: 1px dashed var(--accent);
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            font-family: inherit;
        }
        .compare-group-btn.solid { border-style: solid; background: var(--accent); color: #1a1408; }

        /* Party-group sheet */
        .group-hint { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; }
        .group-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .group-tab {
            padding: 7px 6px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.75rem;
            line-height: 1.3;
        }
        .group-tab b { display: block; font-size: 0.85rem; color: var(--text-primary); }
        .group-tab.active { border-color: var(--accent); background: var(--bg-hover); }
        .group-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 4px;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .group-item input { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
        .group-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .group-item .pct { margin-inline-start: auto; color: var(--text-muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
        .group-empty { font-size: 0.75rem; color: var(--accent); padding: 6px 0; }
        .group-done {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #1a1408;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Party list in sheet */
        .party-list-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .party-list-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
        }
        .party-list-item:active { background: var(--bg-hover); }
        .party-list-item.active { border-color: var(--accent); background: var(--bg-hover); }
        .party-list-item .dot {
            width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
        }
        .party-list-item .name { font-size: 0.8rem; }

        /* Colocated sheet: individual ballot rows */
        .colocated-ballot-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            cursor: pointer;
            transition: background 0.15s;
        }
        .colocated-ballot-row:active { background: var(--bg-hover); }
        .colocated-ballot-num {
            min-width: 32px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--accent);
        }
        .colocated-ballot-info {
            flex: 1;
            font-size: 0.75rem;
        }
    </style>
</head>
