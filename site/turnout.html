    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-primary: #16181d;
            --bg-secondary: #1e212a;
            --bg-tertiary: #272b36;
            --text-primary: #f3f5f8;
            --text-secondary: #c8ceda;
            --text-muted: #939aab;
            --border-color: #3a4050;
            --accent-primary: #f0b429;
            --bloc-right: #4f7cff;
            --bloc-leftcenter: #f97316;
            --bloc-arab: #10b981;
            --gain: #22c55e;
            --lose: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Heebo', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .main-header {
            text-align: center;
            padding: 1.2rem 1.5rem 0.8rem;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-color);
        }
        .main-header h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em; }
        .main-header h1::after {
            content: ''; display: block; width: 3.25rem; height: 2px;
            margin: 0.55rem auto 0; background: var(--accent-primary);
        }
        .main-header .subtitle { color: var(--text-secondary); font-size: 1.05rem; }
        .view-switcher {
            display: flex; justify-content: center; align-items: center; gap: 0.25rem;
            margin-top: 0.6rem; flex-wrap: wrap;
        }
        .view-btn {
            padding: 0.5rem 1.5rem; background: var(--bg-tertiary); color: var(--text-secondary);
            text-decoration: none; border-radius: 8px; font-size: 0.9rem; line-height: 1.25;
            border: 1px solid var(--border-color); cursor: pointer;
        }
        .view-btn:hover { background: #252535; color: var(--text-primary); }
        .view-btn.active { background: var(--accent-primary); color: #1a1408; border-color: var(--accent-primary); }
        .nav-extras { display:flex; justify-content:center; align-items:center; gap:0.25rem; margin-top:0.35rem; flex-wrap: wrap; }
        .nav-extras .view-btn { font-size:0.8rem; padding:0.3rem 0.7rem; opacity:0.7; border:none; background:transparent; }
        .nav-extras .view-btn:hover { opacity:1; background:var(--bg-tertiary); }

        .page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 1.25rem 1rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .back-link {
            color: var(--accent-primary); text-decoration: none; font-size: 0.9rem; align-self: flex-start;
        }
        .back-link:hover { text-decoration: underline; }

        /* Controls */
        .controls {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        .scenario-pills { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .scenario-pill {
            padding: 0.45rem 0.95rem; border-radius: 999px; border: 1px solid var(--border-color);
            background: var(--bg-tertiary); color: var(--text-secondary); font-family: inherit;
            font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem;
        }
        .scenario-pill .dot { width: 10px; height: 10px; border-radius: 50%; }
        .scenario-pill.active { background: var(--accent-primary); color: #1a1408; border-color: var(--accent-primary); font-weight: 600; }
        .scenario-note { font-size: 0.85rem; color: var(--text-secondary); }
        .scenario-pills { align-items: center; }
        .scenario-pills .lbl, .motivation .lbl { font-size: 0.85rem; color: var(--text-secondary); margin-inline-end: 0.3rem; }
        .motivation { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem 1.2rem; }
        .motivation .lbl { grid-column: 1 / -1; }
        .w-row { display: grid; grid-template-columns: 10px auto 1fr 4.6em; gap: 0.5rem; align-items: center; font-size: 0.9rem; }
        .w-row .w-val.up { color: var(--gain); }
        .w-row .w-val.down { color: var(--lose); }
        .w-row .w-val small { display: block; font-size: 0.68rem; font-weight: 500; color: var(--text-muted); }
        .w-row .dot { width: 10px; height: 10px; border-radius: 50%; }
        .cap-row { padding-top: 0.4rem; border-top: 1px dashed var(--border-color, rgba(255,255,255,0.12)); }
        .cap-row .dot { background: var(--text-muted); border-radius: 2px; }
        .w-row input { width: 100%; direction: ltr; accent-color: var(--accent-primary); }
        .w-row .w-val { font-family: 'Inter', 'Heebo', sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; text-align: end; }
        @media (max-width: 800px) { .motivation { grid-template-columns: 1fr; } }

        /* Stage: the shareable card, also the video frame */
        .stage {
            position: relative;
            background: radial-gradient(120% 80% at 50% 0%, #232734 0%, #16181d 70%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.4rem 1.6rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            overflow: hidden;
        }
        .stage-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
        .stage-brand { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.02em; }
        .stage-brand b { color: var(--accent-primary); font-weight: 700; }
        .stage-scenario { font-size: 1.7rem; font-weight: 800; line-height: 1.15; }
        .stage-scenario .sw { display: inline-block; width: 0.7em; height: 0.7em; border-radius: 50%; margin-inline-end: 0.35em; vertical-align: 0.05em; }

        .readout { display: flex; align-items: flex-end; gap: 1.2rem; flex-wrap: wrap; }
        .turnout-num {
            font-family: 'Inter', 'Heebo', sans-serif; font-size: 4.2rem; font-weight: 800; line-height: 0.95;
            font-variant-numeric: tabular-nums; direction: ltr;
        }
        .turnout-meta { display: flex; flex-direction: column; gap: 0.1rem; padding-bottom: 0.35rem; }
        .turnout-label { font-size: 0.95rem; color: var(--text-secondary); }
        .turnout-delta { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .turnout-delta.up { color: var(--gain); }
        .turnout-delta.down { color: var(--lose); }
        .turnout-sub { font-size: 0.82rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

        .vote-stats { display: flex; flex-wrap: wrap; gap: 0.3rem 1.6rem; font-size: 0.9rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
        .vote-stats b { color: var(--text-primary); font-weight: 700; }
        .vote-stats .d { direction: ltr; unicode-bidi: isolate; color: var(--text-muted); font-size: 0.85em; }
        .track { position: relative; height: 10px; background: rgba(255,255,255,0.07); border-radius: 5px; direction: ltr; }
        .track-fill { position: absolute; inset-block: 0; left: 0; border-radius: 5px; background: linear-gradient(90deg, #8a6a1c, var(--accent-primary)); }
        .track-forecast { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--text-primary); opacity: 0.8; }
        .track-labels { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-muted); direction: ltr; margin-top: 0.2rem; position: relative; height: 1rem; }
        .track-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

        .stage-body { display: grid; grid-template-columns: 1.25fr 1fr; gap: 1.2rem; align-items: center; }
        #hemi { width: 100%; height: auto; display: block; }
        .bloc-bars { display: flex; flex-direction: column; gap: 0.7rem; }
        .bloc-row { display: grid; grid-template-columns: 1fr auto; gap: 0.2rem 0.6rem; align-items: baseline; }
        .bloc-name { font-size: 0.95rem; font-weight: 600; }
        .bloc-seats { font-family: 'Inter', 'Heebo', sans-serif; font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; display: inline-flex; align-items: baseline; gap: 0.3em; justify-self: end; }
        .bloc-delta { font-size: 0.85rem; font-weight: 700; direction: ltr; unicode-bidi: isolate; }
        .bloc-delta.up { color: var(--gain); }
        .bloc-delta.down { color: var(--lose); }
        .bloc-bar { grid-column: 1 / -1; position: relative; height: 12px; background: rgba(255,255,255,0.06); border-radius: 6px; }
        .bloc-bar .fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 6px; }
        .bloc-bar .fill.second { border-radius: 0 6px 6px 0; }
        .bloc-bar .majority { position: absolute; top: -4px; bottom: -4px; width: 0; border-inline-start: 2px dashed var(--text-primary); opacity: 0.85; }
        .bloc-row.combined .bloc-name { font-weight: 500; color: var(--text-secondary); font-size: 0.85rem; }
        .bloc-row.combined .bloc-seats { font-size: 1.2rem; color: var(--text-secondary); }
        .bloc-row.has-majority .bloc-seats { color: var(--gain); }
        .majority-note { font-size: 0.75rem; color: var(--text-muted); }

        .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.35rem 0.6rem; }
        .chip { display: grid; grid-template-columns: 6px 1fr auto auto; gap: 0.4rem; align-items: center; font-size: 0.82rem; padding: 0.15rem 0; }
        .chip .c { width: 6px; height: 1.1rem; border-radius: 3px; }
        .chip .n { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
        .chip .n .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chip .n .v { font-size: 0.66rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .chip .s { font-weight: 800; font-variant-numeric: tabular-nums; font-family: 'Inter', 'Heebo', sans-serif; }
        .chip .d { font-size: 0.72rem; font-weight: 700; min-width: 1.8em; text-align: end; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
        .chip .d.up { color: var(--gain); }
        .chip .d.down { color: var(--lose); }
        .chip.out .n, .chip.out .s { color: var(--text-muted); }
        .chip.out .s { font-weight: 500; font-size: 0.7rem; }

        .stage-caption {
            position: absolute; inset-inline: 1.6rem; bottom: 4.2rem;
            background: #1b1e26; border: 1px solid var(--accent-primary); box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border-radius: 12px; padding: 0.9rem 1.2rem; text-align: center;
            font-size: 1.5rem; font-weight: 800; line-height: 1.3;
            opacity: 0; transition: opacity 250ms ease; pointer-events: none;
        }
        .stage-caption small { display: block; font-size: 0.95rem; font-weight: 500; color: var(--text-secondary); margin-top: 0.2rem; }
        .stage-caption.visible { opacity: 1; }
        .stage-foot { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 0.5rem; flex-wrap: wrap; }
        .stage-foot .url { color: var(--accent-primary); font-weight: 600; direction: ltr; }

        /* Chart + notes */
        .panel { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem 1.2rem; }
        .panel h3 { font-size: 1.05rem; margin-bottom: 0.6rem; }
        #chart { width: 100%; height: 300px; display: block; cursor: crosshair; }
        .chart-legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.4rem; }
        .chart-legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-inline-end: 0.3rem; border-radius: 2px; }
        .ex-intro { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; }
        .ex-rates { margin: 0.6rem 0 0.8rem; font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; }
        .ex-rates .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 0.35rem; }
        .ex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0.8rem 1.4rem; }
        .ex-box h4 { font-size: 0.95rem; margin-bottom: 0.35rem; }
        .ex-box table { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
        .ex-box th { font-weight: 500; color: var(--text-muted); font-size: 0.78rem; text-align: start; padding: 0.2rem 0.3rem; border-bottom: 1px solid var(--border-color); }
        .ex-box td { padding: 0.25rem 0.3rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .ex-box td.num, .ex-box th.num { text-align: end; }
        .ex-box td.up { color: #22c55e; }
        .ex-box td.down { color: #ef4444; }
        .ex-box tr.total td { font-weight: 600; border-bottom: none; }
        .ex-box .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 0.35rem; }
        .ex-turnout { margin-top: 0.4rem; font-size: 0.88rem; color: var(--text-secondary); }
        .ex-turnout b { color: var(--text-primary); }
        .notes { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.7; }
        .notes p + p { margin-top: 0.6rem; }
        .notes strong { color: var(--text-primary); }
        .notes code { font-family: 'Inter', monospace; font-size: 0.85em; direction: ltr; unicode-bidi: embed; }

        .main-footer { padding: 1.2rem; text-align: center; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border-color); }
        .main-footer a { color: var(--accent-primary); text-decoration: none; }

        @media (max-width: 800px) {
            .main-header h1 { font-size: 1.6rem; }
            .stage { padding: 1rem; }
            .stage-body { grid-template-columns: 1fr; }
            .turnout-num { font-size: 3.2rem; }
            .stage-scenario { font-size: 1.3rem; }
            .stage-caption { font-size: 1.1rem; bottom: 3.5rem; inset-inline: 1rem; }
            .chips { grid-template-columns: repeat(2, 1fr); }
        }

        /* Recording: only the stage, as a fixed 1080×1080 frame */
        body.record { background: #16181d; overflow: hidden; }
        body.record .main-header,
        body.record .back-link,
        body.record .controls,
        body.record .panel,
        body.record .main-footer,
        body.record #e26-widget,
        body.record .bmc-float { display: none !important; }
        body.record .page { padding: 0; max-width: none; gap: 0; }
        body.record .stage {
            width: 1080px; height: 1080px; border-radius: 0; border: none;
            padding: 36px 56px 24px; gap: 16px;
        }
        body.record .stage-brand { font-size: 22px; }
        body.record .stage-scenario { font-size: 50px; }
        body.record .readout { flex-wrap: nowrap; gap: 36px; }
        body.record .turnout-num { font-size: 104px; flex: 0 0 auto; }
        body.record .turnout-meta { flex: 1; min-width: 0; }
        body.record .turnout-label { font-size: 26px; }
        body.record .turnout-delta { font-size: 30px; }
        body.record .turnout-sub { font-size: 19px; }
        body.record .vote-stats { font-size: 21px; gap: 6px 40px; }
        body.record .track { height: 14px; border-radius: 7px; }
        body.record .track-labels { font-size: 18px; height: 24px; }
        body.record .stage-body { grid-template-columns: 1.3fr 1fr; gap: 30px; }
        body.record .bloc-bars { gap: 12px; }
        body.record .bloc-name { font-size: 25px; }
        body.record .bloc-seats { font-size: 42px; }
        body.record .bloc-delta { font-size: 24px; }
        body.record .bloc-bar { height: 16px; }
        body.record .bloc-row.combined .bloc-name { font-size: 21px; }
        body.record .bloc-row.combined .bloc-seats { font-size: 32px; }
        body.record .majority-note { font-size: 18px; }
        body.record .chips { grid-template-columns: repeat(4, 1fr); gap: 2px 22px; }
        body.record .chip { font-size: 20px; grid-template-columns: 8px 1fr auto auto; padding: 0; }
        body.record .chip .c { width: 8px; height: 22px; }
        body.record .chip .d { font-size: 18px; }
        body.record .chip .n .v { font-size: 14px; }
        body.record .chip.out .s { font-size: 16px; }
        body.record .stage-caption { font-size: 44px; bottom: 120px; inset-inline: 56px; padding: 26px 30px; border-width: 2px; }
        body.record .stage-caption small { font-size: 26px; }
        body.record .stage-foot { font-size: 20px; margin-top: auto; padding-top: 14px; }
    </style>

    <script>
    (function () {
        const STR = {
            title:            { he: 'מה אם יותר אנשים יצביעו?', en: 'What if more people vote?' },
            subtitle:         { he: 'סימולציית הכנסת ה-26: מעלים או מורידים את אחוז ההצבעה בכל גוש, ורואים איך זזים המנדטים', en: 'Knesset 26 simulation: raise or lower each bloc\'s turnout, and watch the seats move' },
            back:             { he: '→ חזרה למחשבון באדר-עופר', en: '← Back to the D\'Hondt calculator' },
            brand:            { he: '<b>קולות נודדים</b> · כנסת 26 · תרחיש מדומה', en: '<b>Kolot Nodedim</b> · Knesset 26 · simulated scenario' },
            presets_label:    { he: 'תרחישים:', en: 'Scenarios:' },
            shifts_label:     { he: 'שינוי באחוז ההצבעה של כל גוש (נקודות אחוז):', en: 'Change in each bloc\'s turnout (percentage points):' },
            preset_forecast:  { he: 'התחזית', en: 'Forecast' },

            notes: {
                he: '<p><strong>מאיפה מתחילים.</strong> התחזית היא הכנסת ה-26 המדומה של האתר: אחוז ההצבעה של כל קלפי הוא אחוז ההצבעה של הקלפי המקבילה בכנסת 25, כפול מקדם ארצי אחד (בערך 1.05) כדי להגיע ל-74.3%. לקלפי חדשה בלי מקבילה מוצמדים אחוז ההצבעה וחלוקת הקולות של קלפיות כנסת 25 הסמוכות.</p>' +

                    '<p><strong>הגרף.</strong> מראה מה קורה אם, מעבר להגדרות הנוכחיות, כל הגושים מוסיפים או מורידים עוד אותו מספר נקודות. הציר האופקי הוא אחוז ההצבעה הארצי שמתקבל.</p>' +
                    '<p><strong>מגבלות.</strong> חלוקת הגושים כמו בשאר האתר (עמך ישראל והנדל–זליכה בגוש הימין). המנדטים מחושבים בבאדר-עופר עם אחוז חסימה של 3.25% והסכמי העודפים של התרחיש. הקוד: <code>generate_turnout_sim.py</code>.</p>',
                en: '<p><strong>Starting point.</strong> The forecast is the site\'s simulated Knesset 26. Each ballot box\'s turnout is its matching K25 box\'s turnout times one national factor (about 1.05) to reach 74.3%. A new box with no match borrows the turnout and vote mix of nearby K25 boxes.</p>' +
                    '<p><strong>Each bloc in each box.</strong> A box\'s non-voters are assumed to split like its voters. So every bloc has voters and non-voters in every box, and its own national turnout (see the example above).</p>' +
                    '<p><strong>Going up.</strong> A slider at +4 raises the bloc\'s turnout by 4 points. The same share of the bloc\'s non-voters shows up in every box, so a box at 60% rises faster than one at 85%. No box passes the {cap} ceiling; where the ceiling binds, the actual rise is smaller than requested and is shown next to the slider.</p>' +
                    '<p><strong>Going down.</strong> A slider at −4 lowers the bloc\'s turnout by 4 points: the same share of its voters stays home in every box. One bloc can rise while another falls. National turnout is the result, not the input. When every bloc moves by the same amount, each box roughly keeps its vote mix and the map barely moves: seats move when the gap between blocs changes.</p>' +
                    '<p><strong>The chart.</strong> Shows what happens if, on top of the current settings, every bloc adds or loses the same number of points. The horizontal axis is the resulting national turnout.</p>' +
                    '<p><strong>Limits.</strong> Blocs are grouped as elsewhere on the site (Amcha Yisrael and Hendel–Zelicha in the right bloc). Seats are allocated by Bader-Ofer with a 3.25% threshold and the scenario\'s surplus agreements. Code: <code>generate_turnout_sim.py</code>.</p>',
            },
        };
        function T(key, params) {
            const e = STR[key];
            let s = e ? (e[i18n.getLang()] || e.he) : key;
            if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
            return s.split('{cap}').join(fmtPct(cap, 0));
        }

        const POLITICAL_ORDER = {
            'הרשימה המשותפת': 0.5, 'רע״ם': 3, 'הדמוקרטים': 5, 'ישר': 6.5, 'ישראל ביתנו': 8,
            'ביחד': 8.5, 'ש״ס': 9, 'יהדות התורה': 10, 'הציבור החרדי': 10.3,
            'הנדל–זליכה': 10.7, 'הליכוד': 11, 'עמך ישראל': 11.5, 'הציונות הדתית': 12,
            'נעם': 12.2, 'עוצמה יהודית': 12.5,
        };
        const BLOCS = ['right', 'leftcenter', 'arab'];
        const BLOC_COLORS = { right: '#4f7cff', leftcenter: '#f97316', arab: '#10b981' };
        // Per-bloc turnout change in percentage points: [right, leftcenter, arab]
        const PRESETS = {
            forecast:   [0, 0, 0],
            everyone:   [4, 4, 4],
            right_home: [-4, 0, 0],
            leftcenter: [0, 4, 0],
            arab:       [0, 0, 6],
            swap:       [-3, 3, 0],
        };
        const RANGE = [0.58, 0.9];
        const S_RANGE = [-15, 15];
        const S_STEP = 0.5;
        const CAP_RANGE = [0.8, 1];
        const THRESHOLD_PCT = 3.25;
        const SEATS = 120;
        const GLOW_FRAMES = 14;

        const params = new URLSearchParams(location.search);
        const RECORD = params.get('record') === '1';
        if (RECORD) document.body.classList.add('record');

        let D, symbols, agreements, blocOfParty, baselineVotes, baselineSeats;
        let shifts = [0, 0, 0];
        let cap = 0.9;
        let turnout;
        let chartTimer = null;

        const fmtPct = (x, d = 1) => (100 * x).toFixed(d) + '%';
        const fmtInt = (n) => i18n.fmtNum(Math.round(n));
        const fmtS = (s, d = 1) => {
            const v = +s.toFixed(d);
            return v === 0 ? (0).toFixed(d) : `${v > 0 ? '+' : '−'}${Math.abs(v).toFixed(d)}`;
        };
        const fmtSShort = (s) => fmtS(s, Number.isInteger(+s.toFixed(1)) ? 0 : 1);

        /* Engine: per-ballot catch-up with bloc motivations */
        const M = {};
        function buildEngine() {
            const n = D.E.length, k = D.P.length;
            M.n = n; M.k = k;
            M.E = Float64Array.from(D.E);
            M.V = Float64Array.from(D.V);
            M.P = D.P.map(col => Float64Array.from(col));
            M.valid = new Float64Array(n);
            M.B = BLOCS.map(() => new Float64Array(n));
            for (let p = 0; p < k; p++) {
                const col = M.P[p], Bj = M.B[blocOfParty[p]];
                for (let b = 0; b < n; b++) { M.valid[b] += col[b]; Bj[b] += col[b]; }
            }
            M.N = new Float64Array(n); M.room = new Float64Array(n); M.vf = new Float64Array(n);
            M.sumE = 0; M.sumV = 0;
            for (let b = 0; b < n; b++) {
                M.N[b] = M.E[b] - M.V[b];
                M.vf[b] = M.valid[b] > 0 ? M.V[b] / M.valid[b] : 1;
                M.sumE += M.E[b]; M.sumV += M.V[b];
            }
            // Each box's non-voters split like its voters, so every bloc has its own
            // eligible (EJ), voters (VJ) and voter-weighted non-voters (NJ) nationally.
            M.EJ = [0, 0, 0]; M.VJ = [0, 0, 0]; M.NJ = [0, 0, 0];
            for (let b = 0; b < n; b++) {
                if (!(M.valid[b] > 0)) continue;
                for (let j = 0; j < 3; j++) {
                    const share = M.B[j][b] / M.valid[b];
                    M.EJ[j] += M.E[b] * share;
                    M.VJ[j] += M.B[j][b] * M.vf[b];
                    M.NJ[j] += M.N[b] * share * M.vf[b];
                }
            }
            computeRoom();
        }

        function computeRoom() {
            for (let b = 0; b < M.n; b++) M.room[b] = Math.max(0, cap * M.E[b] - M.V[b]);
        }

        // Points of bloc turnout → fraction of the bloc's non-voters who show up (s > 0)
        // or of its voters who stay home (s < 0), uniform across boxes before the cap.
        function fractions(s) {
            return s.map((x, j) => {
                const d = x / 100;
                if (d >= 0) return M.NJ[j] > 0 ? Math.min(1, d * M.EJ[j] / M.NJ[j]) : 0;
                return M.VJ[j] > 0 ? Math.max(-1, d * M.EJ[j] / M.VJ[j]) : 0;
            });
        }

        function computeVotes(s) {
            const fr = fractions(s);
            const totals = new Float64Array(M.k);
            const g = [new Float64Array(M.n), new Float64Array(M.n), new Float64Array(M.n)];
            const blocAdded = [0, 0, 0];
            let capped = 0, addedVoters = 0;
            for (let b = 0; b < M.n; b++) {
                const valid = M.valid[b];
                if (!(valid > 0)) continue;
                let want = 0, rem = 0;
                for (let j = 0; j < 3; j++) {
                    if (fr[j] > 0) want += fr[j] * M.N[b] * M.B[j][b] / valid * M.vf[b];
                    else rem -= fr[j] * M.B[j][b] * M.vf[b];
                }
                // Voters who stay home free up room under the cap for the blocs that rise
                const c = want > 0 ? Math.min(1, (M.room[b] + rem) / want) : 1;
                if (c < 1 && M.V[b] < cap * M.E[b]) capped++;
                addedVoters += want * c - rem;
                for (let j = 0; j < 3; j++) {
                    g[j][b] = fr[j] > 0 ? fr[j] * M.N[b] / valid * c : fr[j];
                    blocAdded[j] += M.B[j][b] * g[j][b] * M.vf[b];
                }
            }
            for (let p = 0; p < M.k; p++) {
                const col = M.P[p], gj = g[blocOfParty[p]];
                let sum = 0;
                for (let b = 0; b < M.n; b++) sum += col[b] * (1 + gj[b]);
                totals[p] = sum;
            }
            return {
                votes: Array.from(totals),
                capped,
                turnout: (M.sumV + addedVoters) / M.sumE,
                actual: blocAdded.map((a, j) => M.EJ[j] > 0 ? 100 * a / M.EJ[j] : 0),
            };
        }

        /* Worked example: two illustrative boxes run through the same rule as computeVotes */
        const EX_MIX = [0.5, 0.4, 0.1];
        const EX_BOXES = [{ key: 'ex_box_a', E: 600, t: 0.6 }, { key: 'ex_box_b', E: 600, t: 0.85 }];
        function renderExample() {
            const fr = fractions(shifts);
            const rates = BLOCS.map((b, j) => {
                if (!fr[j]) return '';
                const n = `<span dir="ltr">${fmtPct(Math.abs(fr[j]))}</span>`;
                return `<span><span class="dot" style="background:${BLOC_COLORS[b]}"></span>${T(fr[j] > 0 ? 'ex_rate_up' : 'ex_rate_down', { bloc: T('bloc_' + b), n })}</span>`;
            }).filter(Boolean);
            document.getElementById('ex-rates').innerHTML = rates.length
                ? rates.join('') + `<span style="color:var(--text-muted)">${T('ex_rate_same')}</span>`
                : `<span style="color:var(--text-muted)">${T('ex_rate_none')}</span>`;

            document.getElementById('ex-grid').innerHTML = EX_BOXES.map(box => {
                const V = box.E * box.t;
                const voted = EX_MIX.map(m => V * m);
                const stayed = EX_MIX.map(m => (box.E - V) * m);
                const room = Math.max(0, cap * box.E - V);
                let want = 0, rem = 0;
                fr.forEach((f, j) => { if (f > 0) want += f * stayed[j]; else rem -= f * voted[j]; });
                const c = want > 0 ? Math.min(1, (room + rem) / want) : 1;
                const change = fr.map((f, j) => Math.round(f > 0 ? f * stayed[j] * c : f * voted[j]));
                const after = voted.map((v, j) => v + change[j]);
                const sum = a => a.reduce((x, y) => x + y, 0);
                const cell = x => `<td class="num${x > 0 ? ' up' : x < 0 ? ' down' : ''}" dir="ltr">${x ? fmtS(x, 0) : '0'}</td>`;
                const rows = BLOCS.map((b, j) => `<tr>
                        <td><span class="dot" style="background:${BLOC_COLORS[b]}"></span>${T('bloc_' + b)}</td>
                        <td class="num">${fmtInt(voted[j])}</td><td class="num">${fmtInt(stayed[j])}</td>
                        ${cell(change[j])}<td class="num">${fmtInt(after[j])}</td></tr>`).join('');
                const total = `<tr class="total"><td>${T('ex_total')}</td>
                        <td class="num">${fmtInt(V)}</td><td class="num">${fmtInt(box.E - V)}</td>
                        ${cell(sum(change))}<td class="num">${fmtInt(sum(after))}</td></tr>`;
                const tA = `<span dir="ltr">${fmtPct(box.t)}</span>`, tB = `<span dir="ltr">${fmtPct(sum(after) / box.E)}</span>`;
                return `<div class="ex-box">
                    <h4>${T(box.key, { t: fmtPct(box.t, 0) })}</h4>
                    <table><thead><tr><th>${T('ex_bloc')}</th><th class="num">${T('ex_voted')}</th><th class="num">${T('ex_stayed')}</th><th class="num">${T('ex_change')}</th><th class="num">${T('ex_after')}</th></tr></thead>
                    <tbody>${rows}${total}</tbody></table>
                    <div class="ex-turnout">${T('ex_turnout', { a: tA, b: tB })}${c < 1 ? T('ex_capped') : ''}</div>
                </div>`;
            }).join('');
        }

        function baderOfer(votes) {
            const total = votes.reduce((a, b) => a + b, 0);
            const thresh = total * THRESHOLD_PCT / 100;
            const passed = votes.map(v => v >= thresh);
            const partner = {};
            agreements.forEach(([a, b]) => {
                if (passed[a] && passed[b]) { partner[a] = b; partner[b] = a; }
            });
            const groups = [], seen = new Set();
            votes.forEach((v, i) => {
                if (!passed[i] || seen.has(i)) return;
                const members = partner[i] != null ? [i, partner[i]] : [i];
                members.forEach(m => seen.add(m));
                groups.push({ members, votes: members.reduce((s, m) => s + votes[m], 0), seats: 0 });
            });
            for (let k = 0; k < SEATS; k++) {
                let best = null, bq = -1;
                groups.forEach(g => { const q = g.votes / (g.seats + 1); if (q > bq) { bq = q; best = g; } });
                best.seats++;
            }
            const seats = votes.map(() => 0);
            groups.forEach(g => {
                if (g.members.length === 1) { seats[g.members[0]] = g.seats; return; }
                for (let k = 0; k < g.seats; k++) {
                    let bi = g.members[0], bq = -1;
                    g.members.forEach(m => { const q = votes[m] / (seats[m] + 1); if (q > bq) { bq = q; bi = m; } });
                    seats[bi]++;
                }
            });
            const quota = votes.reduce((a, v, i) => a + (passed[i] ? v : 0), 0) / SEATS;
            return { seats, thresh, passed, quota };
        }

        function blocSeats(seats) {
            const out = { right: 0, leftcenter: 0, arab: 0 };
            seats.forEach((s, i) => { out[BLOCS[blocOfParty[i]]] += s; });
            return out;
        }

        function scenarioTitle() {
            if (shifts.every(x => x === 0)) return T('scen_forecast');
            if (shifts.every(x => x === shifts[0])) {
                return T(shifts[0] > 0 ? 'scen_everyone_up' : 'scen_everyone_down', { n: fmtSShort(shifts[0]) });
            }
            const moved = BLOCS.filter((b, j) => shifts[j] !== 0);
            const sw = moved.length === 1 ? `<span class="sw" style="background:${BLOC_COLORS[moved[0]]}"></span>` : '';
            const list = BLOCS.map((b, j) => shifts[j] === 0 ? null
                : `<span style="color:${BLOC_COLORS[b]}">${T('short_' + b)}</span> <span dir="ltr">${fmtSShort(shifts[j])}</span>`)
                .filter(Boolean).join(' · ');
            return sw + T('scen_list', { list });
        }

        /* Hemicycle */
        const HEMI = { cx: 300, cy: 300, radii: [118, 160, 202, 244, 286] };
        let seatPositions = null;
        let lastColors = [], changedAt = [], frameNo = 0;
        function buildPositions() {
            const sumR = HEMI.radii.reduce((a, b) => a + b, 0);
            const counts = HEMI.radii.map(r => Math.round(SEATS * r / sumR));
            counts[counts.length - 1] += SEATS - counts.reduce((a, b) => a + b, 0);
            const pos = [];
            HEMI.radii.forEach((r, row) => {
                const n = counts[row];
                for (let s = 0; s < n; s++) {
                    const angle = Math.PI - (Math.PI * (s + 0.5)) / n;
                    pos.push({ x: HEMI.cx + r * Math.cos(angle), y: HEMI.cy - r * Math.sin(angle), angle, row });
                }
            });
            pos.sort((a, b) => b.angle - a.angle || a.row - b.row);
            seatPositions = pos;
        }

        function drawHemi(seats) {
            if (!seatPositions) buildPositions();
            const order = symbols.map((s, i) => i)
                .filter(i => seats[i] > 0)
                .sort((a, b) => (POLITICAL_ORDER[D.parties[a].name] ?? 50) - (POLITICAL_ORDER[D.parties[b].name] ?? 50));
            const colors = [];
            order.forEach(i => { for (let k = 0; k < seats[i]; k++) colors.push(D.parties[i].color); });
            frameNo++;
            colors.forEach((c, k) => {
                if (lastColors[k] !== undefined && lastColors[k] !== c) changedAt[k] = frameNo;
            });
            lastColors = colors;
            const data = seatPositions.slice(0, colors.length).map((p, k) => ({
                ...p, color: colors[k],
                glow: changedAt[k] ? Math.max(0, 1 - (frameNo - changedAt[k]) / GLOW_FRAMES) : 0,
            }));
            const svg = d3.select('#hemi');
            svg.selectAll('circle.seat').data(data).join('circle')
                .attr('class', 'seat')
                .attr('cx', d => d.x).attr('cy', d => d.y)
                .attr('r', d => 10.5 + d.glow * 2.5)
                .attr('fill', d => d.color)
                .attr('stroke', d => d.glow > 0 ? '#fff' : 'rgba(0,0,0,0.45)')
                .attr('stroke-width', d => d.glow > 0 ? 1 + d.glow * 2.5 : 0.8)
                .attr('stroke-opacity', d => d.glow > 0 ? d.glow : 1);
            let label = svg.select('text.hemi-label');
            if (label.empty()) label = svg.append('text').attr('class', 'hemi-label')
                .attr('x', HEMI.cx).attr('y', HEMI.cy - 8).attr('text-anchor', 'middle')
                .attr('fill', '#939aab').attr('font-size', 22).attr('font-weight', 600);
            label.text(i18n.getLang() === 'en' ? '120 seats' : '120 מנדטים');
        }

        function blocBarsHtml(bs, base) {
            const scale = 75;
            const pct = n => Math.min(100, 100 * n / scale);
            const delta = (n, b) => {
                const d = n - b;
                if (!d) return '';
                return `<span class="bloc-delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${Math.abs(d)}</span>`;
            };
            const row = (label, n, b, fills, extra = '') => `
                <div class="bloc-row ${extra} ${n >= 61 ? 'has-majority' : ''}">
                    <div class="bloc-name">${label}</div>
                    <div class="bloc-seats">${n}${delta(n, b)}</div>
                    <div class="bloc-bar">${fills}<div class="majority" style="inset-inline-start:${pct(61)}%"></div></div>
                </div>`;
            const fill = (n, color, start = 0) =>
                `<div class="fill" style="inset-inline-start:${pct(start)}%;width:${pct(n)}%;background:${color}"></div>`;
            return row(T('bloc_right'), bs.right, base.right, fill(bs.right, BLOC_COLORS.right)) +
                row(T('bloc_leftcenter'), bs.leftcenter, base.leftcenter, fill(bs.leftcenter, BLOC_COLORS.leftcenter)) +
                row(T('bloc_arab'), bs.arab, base.arab, fill(bs.arab, BLOC_COLORS.arab)) +
                row(T('bloc_combined'), bs.leftcenter + bs.arab, base.leftcenter + base.arab,
                    fill(bs.leftcenter, BLOC_COLORS.leftcenter) + fill(bs.arab, BLOC_COLORS.arab, bs.leftcenter), 'combined') +
                `<div class="majority-note">${T('majority_note')}</div>`;
        }

        function chipsHtml(votes, res) {
            const total = votes.reduce((a, b) => a + b, 0);
            const baseTotal = baselineVotes.reduce((a, b) => a + b, 0);
            return symbols.map((s, i) => i)
                .filter(i => baselineVotes[i] / baseTotal >= 0.01 || res.seats[i] > 0)
                .sort((a, b) => res.seats[b] - res.seats[a] || votes[b] - votes[a])
                .map(i => {
                    const p = D.parties[i];
                    const n = res.seats[i], d = n - baselineSeats[i];
                    const out = !res.passed[i];
                    const dTxt = d ? `${d > 0 ? '+' : '−'}${Math.abs(d)}` : '';
                    return `<div class="chip ${out ? 'out' : ''}">
                        <span class="c" style="background:${p.color}"></span>
                        <span class="n"><span class="nm">${i18n.partyName(p.name)}</span><span class="v">${i18n.fmtNum(Math.round(votes[i]))}</span></span>
                        <span class="s">${out ? (100 * votes[i] / total).toFixed(1) + '%' : n}</span>
                        <span class="d ${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${dTxt}</span>
                    </div>`;
                }).join('');
        }

        let current = null;
        function render() {
            const out = computeVotes(shifts);
            const { votes, capped } = out;
            turnout = out.turnout;
            const res = baderOfer(votes);
            const bs = blocSeats(res.seats);
            const base = blocSeats(baselineSeats);
            const t0 = M.sumV / M.sumE;
            current = { votes, res, bs, base, actual: out.actual };
            syncActual(out.actual);
            if (!RECORD) renderExample();

            document.getElementById('stage-scenario').innerHTML = scenarioTitle();
            document.getElementById('turnout-num').textContent = fmtPct(turnout);
            const dPts = 100 * (turnout - t0);
            const deltaEl = document.getElementById('turnout-delta');
            if (Math.abs(dPts) < 0.05) {
                deltaEl.textContent = T('at_forecast');
                deltaEl.className = 'turnout-delta';
            } else {
                deltaEl.textContent = T('delta_pts', { sign: dPts > 0 ? '+' : '−', n: Math.abs(dPts).toFixed(1) });
                deltaEl.className = 'turnout-delta ' + (dPts > 0 ? 'up' : 'down');
            }
            const extra = (turnout - t0) * M.sumE;
            const sub = [];
            if (Math.abs(extra) >= 500) sub.push(T(extra > 0 ? 'voters_more' : 'voters_fewer', { n: fmtInt(Math.abs(extra)) }));
            if (capped) sub.push(T('stuck', { n: fmtInt(capped) }));
            document.getElementById('turnout-sub').textContent = sub.join(' · ');

            const baseRes = baderOfer(baselineVotes);
            const stat = (key, now, was) => {
                const d = Math.round(now - was);
                const dTxt = Math.abs(d) >= 1 ? ` <span class="d">(${d > 0 ? '+' : '−'}${fmtInt(Math.abs(d))})</span>` : '';
                return `<span>${T(key, { n: `<b>${fmtInt(Math.round(now))}</b>` })}${dTxt}</span>`;
            };
            document.getElementById('vote-stats').innerHTML =
                stat('threshold_stat', res.thresh, baseRes.thresh) + stat('quota_stat', res.quota, baseRes.quota);

            const span = RANGE[1] - RANGE[0];
            const pos = x => Math.max(0, Math.min(100, 100 * (x - RANGE[0]) / span));
            document.getElementById('track-fill').style.width = pos(turnout) + '%';
            document.getElementById('track-forecast').style.left = `calc(${pos(t0)}% - 1px)`;

            drawHemi(res.seats);
            document.getElementById('bloc-bars').innerHTML = blocBarsHtml(bs, base);
            document.getElementById('chips').innerHTML = chipsHtml(votes, res);
            drawChartCursor();
        }

        function trackLabels() {
            const span = RANGE[1] - RANGE[0];
            const pos = x => 100 * (x - RANGE[0]) / span;
            const ticks = [];
            for (let x = 0.60; x <= RANGE[1] + 1e-9; x += 0.05) ticks.push(Math.round(x * 100) / 100);
            document.getElementById('track-labels').innerHTML =
                ticks.map(x => `<span style="left:${pos(x)}%">${fmtPct(x, 0)}</span>`).join('') +
                `<span style="left:${pos(D.baseline_turnout)}%;color:var(--text-primary);top:${RECORD ? 24 : 14}px">${T('forecast')} ${fmtPct(D.baseline_turnout)}</span>`;
            document.getElementById('track-labels').style.height = RECORD ? '50px' : '30px';
        }

        /* Chart */
        let chartX, chartY;
        function drawChart() {
            if (RECORD) return;
            const svg = d3.select('#chart');
            svg.selectAll('*').remove();
            const node = svg.node();
            const W = node.clientWidth || 900, H = 300;
            const m = { top: 14, right: 18, bottom: 32, left: 40 };
            svg.attr('viewBox', `0 0 ${W} ${H}`);
            const series = [];
            for (let u = -12; u <= 12 + 1e-9; u += 0.25) {
                const out = computeVotes(shifts.map(x => x + u));
                series.push({ u, t: out.turnout, ...blocSeats(baderOfer(out.votes).seats) });
            }
            chartX = d3.scaleLinear()
                .domain([Math.min(series[0].t, D.baseline_turnout), Math.max(series[series.length - 1].t, D.baseline_turnout)])
                .range([m.left, W - m.right]);
            chartY = d3.scaleLinear().domain([0, 75]).range([H - m.bottom, m.top]);
            const g = svg.append('g').attr('direction', 'ltr');
            g.append('g').attr('transform', `translate(0,${H - m.bottom})`)
                .call(d3.axisBottom(chartX).ticks(8).tickFormat(d => fmtPct(d, 0)))
                .call(a => a.selectAll('text').attr('fill', '#939aab'))
                .call(a => a.selectAll('line,path').attr('stroke', '#3a4050'));
            g.append('g').attr('transform', `translate(${m.left},0)`)
                .call(d3.axisLeft(chartY).tickValues([0, 15, 30, 45, 61, 75]))
                .call(a => a.selectAll('text').attr('fill', '#939aab'))
                .call(a => a.selectAll('line,path').attr('stroke', '#3a4050'));
            g.append('line').attr('x1', m.left).attr('x2', W - m.right)
                .attr('y1', chartY(61)).attr('y2', chartY(61))
                .attr('stroke', '#f3f5f8').attr('stroke-dasharray', '5 4').attr('opacity', 0.6);
            g.append('line').attr('x1', chartX(D.baseline_turnout)).attr('x2', chartX(D.baseline_turnout))
                .attr('y1', m.top).attr('y2', H - m.bottom)
                .attr('stroke', '#f0b429').attr('stroke-width', 1.5).attr('opacity', 0.8);
            BLOCS.forEach(b => {
                g.append('path').datum(series)
                    .attr('fill', 'none').attr('stroke', BLOC_COLORS[b]).attr('stroke-width', 2.5)
                    .attr('d', d3.line().curve(d3.curveStepAfter).x(d => chartX(d.t)).y(d => chartY(d[b])));
            });
            g.append('line').attr('class', 'cursor').attr('y1', m.top).attr('y2', H - m.bottom)
                .attr('stroke', '#f3f5f8').attr('stroke-width', 1.5);
            svg.on('click', (ev) => {
                const t = chartX.invert(d3.pointer(ev)[0]);
                const near = series.reduce((a, d) => Math.abs(d.t - t) < Math.abs(a.t - t) ? d : a);
                setShifts(shifts.map(x => x + near.u), { resetGlow: true });
            });
            document.getElementById('chart-legend').innerHTML =
                BLOCS.map(b => `<span><i style="background:${BLOC_COLORS[b]}"></i>${T('bloc_' + b)}</span>`).join('') +
                `<span><i style="background:#f0b429"></i>${T('forecast')}</span><span><i style="background:#f3f5f8;opacity:.6"></i>61</span>` +
                `<span style="color:var(--text-muted)">${T('chart_hint')}</span>`;
            drawChartCursor();
        }
        function scheduleChart() {
            clearTimeout(chartTimer);
            chartTimer = setTimeout(drawChart, 150);
        }
        function drawChartCursor() {
            if (!chartX) return;
            d3.select('#chart .cursor').attr('x1', chartX(turnout)).attr('x2', chartX(turnout));
        }

        /* Controls */
        const clampS = x => Math.max(S_RANGE[0], Math.min(S_RANGE[1], Math.round(x / S_STEP) * S_STEP));
        function setShifts(s, { resetGlow = false } = {}) {
            shifts = s.map(clampS);
            if (resetGlow) { lastColors = []; changedAt = []; }
            syncControls();
            if (!RECORD) {
                const u = new URL(location.href);
                u.searchParams.delete('w');
                u.searchParams.delete('t');
                if (shifts.every(x => x === 0)) u.searchParams.delete('s');
                else u.searchParams.set('s', shifts.join(','));
                history.replaceState(null, '', u);
            }
            render();
            scheduleChart();
        }
        function setCap(c) {
            cap = Math.max(CAP_RANGE[0], Math.min(CAP_RANGE[1], Math.round(c * 100) / 100));
            computeRoom();
            const input = document.getElementById('cap-input');
            if (input && document.activeElement !== input) input.value = cap;
            const val = document.getElementById('cap-val');
            if (val) val.textContent = fmtPct(cap, 0);
            document.getElementById('notes').innerHTML = T('notes');
            if (!RECORD) {
                const u = new URL(location.href);
                if (Math.abs(cap - 0.9) < 1e-9) u.searchParams.delete('cap');
                else u.searchParams.set('cap', cap.toFixed(2));
                history.replaceState(null, '', u);
            }
            syncControls();
            render();
            scheduleChart();
        }
        function syncControls() {
            BLOCS.forEach((b, j) => {
                const input = document.getElementById('w-' + b);
                if (input) input.value = shifts[j];
            });
            document.querySelectorAll('#presets .scenario-pill').forEach(p => {
                const ps = PRESETS[p.dataset.p];
                p.classList.toggle('active', ps.every((x, j) => x === shifts[j]));
            });
            document.getElementById('scenario-note').textContent = T('note');
        }
        // Requested points next to each slider, plus what the cap actually allowed
        function syncActual(actual) {
            BLOCS.forEach((b, j) => {
                const val = document.getElementById('wv-' + b);
                if (!val) return;
                const s = shifts[j];
                val.className = 'w-val' + (s > 0 ? ' up' : s < 0 ? ' down' : '');
                const short = Math.abs(actual[j] - s) >= 0.1;
                val.innerHTML = `<span dir="ltr">${fmtS(s)}</span>` +
                    (short ? `<small>${T('actual', { n: `<span dir="ltr">${fmtS(actual[j])}</span>` })}</small>` : '');
            });
        }
        function renderControls() {
            document.getElementById('presets').innerHTML = `<span class="lbl">${T('presets_label')}</span>` +
                Object.keys(PRESETS).map(k => {
                    const ps = PRESETS[k];
                    const moved = BLOCS.filter((b, j) => ps[j] !== 0 && !ps.every(x => x === ps[0]));
                    const dot = !moved.length ? '' : `<span class="dot" style="background:${moved.length === 1 ? BLOC_COLORS[moved[0]] : `linear-gradient(90deg, ${BLOC_COLORS[moved[0]]} 50%, ${BLOC_COLORS[moved[1]]} 50%)`}"></span>`;
                    return `<button class="scenario-pill" data-p="${k}">${dot}${T('preset_' + k, { n: ps[0] })}</button>`;
                }).join('');
            document.getElementById('motivation').innerHTML = `<div class="lbl">${T('shifts_label')}</div>` +
                BLOCS.map(b => `
                    <label class="w-row">
                        <span class="dot" style="background:${BLOC_COLORS[b]}"></span>
                        <span class="w-name">${T('bloc_' + b)}</span>
                        <input type="range" id="w-${b}" data-b="${b}" min="${S_RANGE[0]}" max="${S_RANGE[1]}" step="${S_STEP}">
                        <span class="w-val" id="wv-${b}"></span>
                    </label>`).join('') + `
                    <label class="w-row cap-row">
                        <span class="dot"></span>
                        <span class="w-name">${T('cap_label')}</span>
                        <input type="range" id="cap-input" min="${CAP_RANGE[0]}" max="${CAP_RANGE[1]}" step="0.01" value="${cap}">
                        <span class="w-val" id="cap-val">${fmtPct(cap, 0)}</span>
                    </label>`;
            syncControls();
        }
        function applyStatic() {
            document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
            document.getElementById('stage-brand').innerHTML = T('brand');
            document.getElementById('foot-note').textContent = T('foot');
            document.getElementById('notes').innerHTML = T('notes');
            document.title = T('title') + ' - ' + (i18n.getLang() === 'en' ? 'Kolot Nodedim' : 'קולות נודדים');
            renderControls();
            trackLabels();
        }

        /* Recorder hooks */
        window.TurnoutSim = {
            presets: PRESETS,
            setShifts: (s) => setShifts(s),
            setCap: (c) => setCap(c),
            clearGlow: () => { changedAt = []; render(); },
            caption(kind) {
                const el = document.getElementById('stage-caption');
                if (!kind) { el.classList.remove('visible'); return; }
                if (kind === 'outro') {
                    el.innerHTML = `${T('outro')}<small>${T('outro_sub')}</small>`;
                } else {
                    const { bs, base } = current;
                    const mover = BLOCS.reduce((a, b) => Math.abs(bs[b] - base[b]) > Math.abs(bs[a] - base[a]) ? b : a);
                    el.innerHTML = bs[mover] === base[mover]
                        ? `${T('cap_everyone')}<small>${T('cap_sub', { t: fmtPct(turnout) })}</small>`
                        : `${T('cap_bloc', { bloc: T('bloc_' + mover), a: base[mover], b: bs[mover] })}<small>${T('cap_sub', { t: fmtPct(turnout) })}</small>`;
                }
                el.classList.add('visible');
            },
        };

        function showPaused() {
            document.querySelectorAll('main.page > section').forEach(el => { el.style.display = 'none'; });
            const note = document.createElement('section');
            note.className = 'panel';
            const paint = () => {
                note.innerHTML = `<h3>${i18n.t('turnout_k26_paused_title')}</h3><p>${i18n.t('turnout_k26_paused')}</p>`;
                document.querySelector('.main-header h1').textContent = T('title');
                document.querySelector('.main-header .subtitle').textContent = '';
                document.querySelector('.back-link').textContent = T('back');
                document.title = T('title') + ' - ' + (i18n.getLang() === 'en' ? 'Kolot Nodedim' : 'קולות נודדים');
            };
            document.querySelector('main.page').appendChild(note);
            paint();
            window.addEventListener('langchange', paint);
        }

        // The data is a what-if on the simulated forecast; it has no meaning next to a real count.
        i18n.whenK26Status()
            .then(() => {
                if (i18n.k26Live()) { showPaused(); return null; }
                return fetch('data/turnout_ballots_26.json').then(r => r.json());
            })
            .then(data => {
                if (!data) return;
                D = data;
                symbols = D.parties.map(p => p.symbol);
                agreements = D.agreements.map(([a, b]) => [symbols.indexOf(a), symbols.indexOf(b)]);
                const blocOf = {};
                Object.entries(D.blocs).forEach(([b, syms]) => syms.forEach(s => { blocOf[s] = BLOCS.indexOf(b); }));
                blocOfParty = symbols.map(s => blocOf[s]);
                const cp = parseFloat(params.get('cap'));
                if (isFinite(cp)) cap = Math.max(CAP_RANGE[0], Math.min(CAP_RANGE[1], cp > 1 ? cp / 100 : cp));
                buildEngine();
                baselineVotes = D.P.map(col => col.reduce((a, b) => a + b, 0));
                baselineSeats = baderOfer(baselineVotes).seats;

                const sp = (params.get('s') || '').split(',').map(parseFloat);
                const preset = PRESETS[params.get('scenario')];
                const initial = sp.length === 3 && sp.every(isFinite) ? sp : (preset || PRESETS.forecast);

                applyStatic();
                document.getElementById('presets').addEventListener('click', e => {
                    const b = e.target.closest('.scenario-pill');
                    if (b) setShifts(PRESETS[b.dataset.p].slice(), { resetGlow: true });
                });
                document.getElementById('motivation').addEventListener('input', e => {
                    if (e.target.id === 'cap-input') { setCap(parseFloat(e.target.value)); return; }
                    if (!e.target.dataset.b) return;
                    const j = BLOCS.indexOf(e.target.dataset.b);
                    const s = shifts.slice();
                    s[j] = parseFloat(e.target.value);
                    setShifts(s);
                });
                window.addEventListener('resize', () => scheduleChart());
                window.addEventListener('langchange', () => { applyStatic(); render(); scheduleChart(); });

                setShifts(initial);
                drawChart();
                window.TurnoutSim.ready = true;
            });
    })();
    </script>
    <script>if (!document.body.classList.contains('record')) { i18n.renderNav('turnout'); }</script>
</body>
