    <style>
        :root {
            --bg-primary: #16181d;
            --bg-secondary: #1e212a;
            --bg-tertiary: #272b36;
            --text-primary: #f3f5f8;
            --text-secondary: #c8ceda;
            --text-muted: #939aab;
            --border-color: #3a4050;
            --accent-primary: #f0b429;
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Heebo', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-header {
            text-align: center;
            padding: 1.2rem 1rem 0.8rem;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-color);
        }

        .main-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
                        color: var(--text-primary);
        }
        .main-header h1::after {
            content: '';
            display: block;
            width: 3.25rem;
            height: 2px;
            margin: 0.55rem auto 0;
            background: var(--accent-primary);
        }


        .title-icon {
            display: inline-block;
            margin-left: 0.5rem;
            -webkit-text-fill-color: initial;
        }

        .main-header .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .view-switcher {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.6rem;
            flex-wrap: wrap;
        }

        .view-btn {
            padding: 0.5rem 1.5rem;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.25;
            border: 1px solid var(--border-color);
            transition: all 0.15s ease;
            cursor: pointer;
            white-space: nowrap;
        }

        .view-btn:hover { background: #252535; color: var(--text-primary); }
        .view-btn.active { background: var(--accent-primary); color: #1a1408; border-color: var(--accent-primary); font-weight: 600; }

        .nav-extras { display:flex; justify-content:center; align-items:center; gap:0.25rem; margin-top:0.35rem; padding-bottom:0.1rem; }
        .nav-extras .view-btn { font-size:0.8rem; padding:0.3rem 0.7rem; opacity:0.7; border:none; background:transparent; }
        .nav-extras .view-btn:hover { opacity:1; background:var(--bg-tertiary); }
        .nav-extras .view-btn.active { opacity:1; background:var(--accent-primary); border:none; }

        .page-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 1.2rem 0 0.3rem;
        }

        .page-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 0 0 0.5rem;
        }

        .main-content {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 1.5rem;
        }

        .forum-tabs {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .forum-tab {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .forum-tab:hover { color: var(--text-primary); border-color: var(--text-muted); }
        .forum-tab.active { background: var(--accent-primary); color: #1a1408; border-color: var(--accent-primary); }

        .giscus-container {
            min-height: 300px;
        }

        .main-footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            text-align: center;
        }

        .main-footer .credits {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .main-footer a {
            color: var(--accent-primary);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <h1><span data-i18n="site_title">קולות נודדים</span></h1>
            <p class="subtitle" data-i18n="site_subtitle">ניתוח מעבר קולות בין בחירות לכנסת ישראל</p>
            <nav class="view-switcher"></nav>
        </header>

        <h2 class="page-title" data-i18n="discussions_title">דיונים</h2>
        <p class="page-subtitle" data-i18n="discussions_subtitle">שאלות, רעיונות ודיונים על האתר ועל בחירות</p>

        <div class="main-content">
            <div class="forum-tabs" id="forum-tabs">
                <button class="forum-tab active" data-term="Site Feedback" data-i18n="forum_feedback">משוב על האתר</button>
                <button class="forum-tab" data-term="Feature Ideas" data-i18n="forum_features">הצעות לפיצ'רים</button>
                <button class="forum-tab" data-term="Elections Theory" data-i18n="forum_elections">תאוריית בחירות</button>
                <button class="forum-tab" data-term="Data and Methodology" data-i18n="forum_data">נתונים ומתודולוגיה</button>
                <button class="forum-tab" data-term="General" data-i18n="forum_general">שיחה חופשית</button>
            </div>

            <div class="giscus-container" id="giscus-container"></div>
        </div>

        <footer class="main-footer">
            <p class="credits">
                <span data-i18n="credits_line">© הראל קין</span> |
                <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a> |
                <a href="https://github.com/harelc/elections-vote-transfer/" target="_blank" data-i18n="source_code">קוד מקור</a> |
                <a href="https://www.buymeacoffee.com/harelc" target="_blank" class="bmc-footer-link" rel="noopener noreferrer" style="color:#d97706;white-space:nowrap">
                    <img src="https://cdn.buymeacoffee.com/buttons/bmc-new-btn-logo.svg" alt="" style="width:14px;height:14px;vertical-align:-2px">
                    <span data-i18n="bmc_short">Buy me a coffee</span>
                </a>
            </p>
        </footer>
    </div>

    <script>
    (function() {
        'use strict';

        const container = document.getElementById('giscus-container');
        let currentTerm = 'Site Feedback';

        function loadGiscus(term) {
            container.innerHTML = '';
            const script = document.createElement('script');
            script.src = 'https://giscus.app/client.js';
            script.setAttribute('data-repo', 'harelc/elections-vote-transfer');
            script.setAttribute('data-repo-id', 'MDEwOlJlcG9zaXRvcnkyMDk3NjMzMTg=');
            script.setAttribute('data-category', 'General');
            script.setAttribute('data-category-id', 'DIC_kwDODIC79s4C2KaY');
            script.setAttribute('data-mapping', 'specific');
            script.setAttribute('data-term', term);
            script.setAttribute('data-strict', '0');
            script.setAttribute('data-reactions-enabled', '0');
            script.setAttribute('data-emit-metadata', '0');
            script.setAttribute('data-input-position', 'top');
            script.setAttribute('data-theme', 'dark');
            script.setAttribute('data-lang', i18n.getLang());
            script.setAttribute('crossorigin', 'anonymous');
            script.async = true;
            container.appendChild(script);
            currentTerm = term;
        }

        document.getElementById('forum-tabs').addEventListener('click', e => {
            const tab = e.target.closest('.forum-tab');
            if (!tab || tab.classList.contains('active')) return;
            document.querySelectorAll('.forum-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            loadGiscus(tab.dataset.term);
        });

        window.addEventListener('langchange', () => {
            const iframe = document.querySelector('iframe.giscus-frame');
            if (iframe) {
                iframe.contentWindow.postMessage(
                    { giscus: { setConfig: { lang: i18n.getLang() } } },
                    'https://giscus.app'
                );
            }
        });

        loadGiscus(currentTerm);
    })();
    </script>
    <script>i18n.renderNav('discussions'); i18n.renderBMC();</script>
    <script src="webinar-modal.js"></script>
</body>
</html>
